name: Access matrix
on: workflow_dispatch
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Cloudflare capabilities
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json,os,urllib.request,urllib.error
          T=os.environ.get('CF') or ''
          print('CF_token_set', bool(T), 'len', len(T))
          H={'Authorization':'Bearer '+T,'Content-Type':'application/json'}
          def api(m,u,b=None):
            d=None if b is None else json.dumps(b).encode()
            req=urllib.request.Request(u,data=d,headers=H,method=m)
            try:
              with urllib.request.urlopen(req,timeout=40) as r:
                return r.status, json.loads(r.read().decode() or '{}')
            except urllib.error.HTTPError as e:
              try: j=json.loads(e.read().decode())
              except: j={}
              return e.code,j
          checks=[
            ('token_verify','GET','https://api.cloudflare.com/client/v4/user/tokens/verify',None),
            ('zones','GET','https://api.cloudflare.com/client/v4/zones?per_page=5',None),
            ('dns_list','GET','https://api.cloudflare.com/client/v4/zones/dd571aeb31649f036f3a8e49e2acd202/dns_records?per_page=5',None),
            ('workers_scripts','GET','https://api.cloudflare.com/client/v4/accounts/04faced90ecdb9aae7c15537751180da/workers/scripts',None),
            ('workers_routes','GET','https://api.cloudflare.com/client/v4/zones/dd571aeb31649f036f3a8e49e2acd202/workers/routes',None),
            ('purge','POST','https://api.cloudflare.com/client/v4/zones/dd571aeb31649f036f3a8e49e2acd202/purge_cache',{"files":["https://astranov.eu/"]}),
            ('pages_projects','GET','https://api.cloudflare.com/client/v4/accounts/04faced90ecdb9aae7c15537751180da/pages/projects',None),
          ]
          for name,m,u,b in checks:
            st,j=api(m,u,b)
            err=(j.get('errors') or [{}])[0]
            print(f'{name}: http={st} success={j.get("success")} err={err.get("message") or err.get("code") or ""}')
          PY
      - name: Supabase management + secrets presence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          XAI: ${{ secrets.XAI_API_KEY }}
          GROQ: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN2: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "GH_SECRET_SUPABASE_ACCESS_TOKEN_set=$([ -n \"$SUPABASE_ACCESS_TOKEN\" ] && echo yes || echo no) len=${#SUPABASE_ACCESS_TOKEN}"
          echo "GH_SECRET_XAI_API_KEY_set=$([ -n \"$XAI\" ] && echo yes || echo no) len=${#XAI}"
          echo "GH_SECRET_GROQ_set=$([ -n \"$GROQ\" ] && echo yes || echo no)"
          echo "GH_SECRET_OPENROUTER_set=$([ -n \"$OPENROUTER\" ] && echo yes || echo no)"
          echo "GH_SECRET_GEMINI_set=$([ -n \"$GEMINI\" ] && echo yes || echo no)"
          echo "GH_SECRET_ANTHROPIC_set=$([ -n \"$ANTHROPIC\" ] && echo yes || echo no)"
          echo "GH_SECRET_VERCEL_TOKEN_set=$([ -n \"$VERCEL_TOKEN\" ] && echo yes || echo no) len=${#VERCEL_TOKEN}"
          echo "GH_SECRET_VERCEL_ACCESS_TOKEN_set=$([ -n \"$VERCEL_TOKEN2\" ] && echo yes || echo no) len=${#VERCEL_TOKEN2}"
          echo "GH_SECRET_CLOUDFLARE_API_TOKEN_set=$([ -n \"$CF\" ] && echo yes || echo no) len=${#CF}"
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            curl -sS -m 20 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              https://api.supabase.com/v1/projects | python3 -c "import sys,json;d=json.load(sys.stdin);print('projects', type(d).__name__, 'count', len(d) if isinstance(d,list) else d)"
            curl -sS -m 20 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              https://api.supabase.com/v1/projects/lkoatrkhuigdolnjsbie | python3 -c "import sys,json;d=json.load(sys.stdin);print('project', d.get('name'), d.get('id'), d.get('status') or d.get('organization_id'))"
            # secrets list names only
            npx --yes supabase@2 secrets list --project-ref lkoatrkhuigdolnjsbie 2>&1 | head -40
          fi
          if [ -n "$VERCEL_TOKEN" ] || [ -n "$VERCEL_TOKEN2" ]; then
            TOK="${VERCEL_TOKEN:-$VERCEL_TOKEN2}"
            curl -sS -m 20 -H "Authorization: Bearer $TOK" https://api.vercel.com/v2/user | python3 -c "import sys,json;d=json.load(sys.stdin);u=d.get('user') or d;print('vercel_user', u.get('username') or u.get('email') or d)"
            curl -sS -m 20 -H "Authorization: Bearer $TOK" "https://api.vercel.com/v9/projects?limit=10" | python3 -c "import sys,json;d=json.load(sys.stdin);ps=d.get('projects') or [];print('projects',[p.get('name') for p in ps[:10]]);print('err',d.get('error'))"
          fi
