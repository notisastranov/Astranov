name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    name: Deploy edge functions
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lkoatrkhuigdolnjsbie
        run: |
          set +e
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          CRITICAL="aci aicycle coders-bridge"
          OPTIONAL="vendor-crawler order-intake menu-request site-provision node-batch debug-write debug-reader ai-router astranov-api brain council voice gtiles"
          FAILED=""
          deploy_one() {
            local fn="$1"
            local tries="${2:-3}"
            echo ""
            echo "=== Deploying $fn ==="
            if [ ! -d "supabase/functions/$fn" ]; then
              echo "skipped (no source dir)"
              return 0
            fi
            local n=0
            while [ "$n" -lt "$tries" ]; do
              n=$((n + 1))
              if supabase functions deploy "$fn" --no-verify-jwt; then
                return 0
              fi
              echo "deploy $fn attempt $n failed — retry in 15s"
              sleep 15
            done
            return 1
          }
          for fn in $CRITICAL; do
            deploy_one "$fn" || FAILED="$FAILED $fn"
          done
          for fn in $OPTIONAL; do
            deploy_one "$fn" || echo "optional deploy failed: $fn"
          done
          if [ -n "$FAILED" ]; then
            echo "Critical function deploy failed:$FAILED"
            exit 1
          fi

      - name: Sync edge secrets (presence only; values from GH secrets)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: lkoatrkhuigdolnjsbie
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARCHITECT_EMAIL: ${{ secrets.ARCHITECT_EMAIL }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No SUPABASE_ACCESS_TOKEN — skip secret sync"
            exit 0
          fi
          supabase link --project-ref "$SUPABASE_PROJECT_REF" || true
          ARGS=()
          [ -n "$ANTHROPIC_API_KEY" ] && ARGS+=("ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY") && echo "sync ANTHROPIC_API_KEY"
          [ -n "$OPENAI_API_KEY" ] && ARGS+=("OPENAI_API_KEY=$OPENAI_API_KEY") && echo "sync OPENAI_API_KEY"
          [ -n "$GROQ_API_KEY" ] && ARGS+=("GROQ_API_KEY=$GROQ_API_KEY") && echo "sync GROQ_API_KEY"
          [ -n "$XAI_API_KEY" ] && ARGS+=("XAI_API_KEY=$XAI_API_KEY") && echo "sync XAI_API_KEY"
          [ -n "$OPENROUTER_API_KEY" ] && ARGS+=("OPENROUTER_API_KEY=$OPENROUTER_API_KEY") && echo "sync OPENROUTER_API_KEY"
          [ -n "$GEMINI_API_KEY" ] && ARGS+=("GEMINI_API_KEY=$GEMINI_API_KEY") && echo "sync GEMINI_API_KEY"
          ARGS+=("ARCHITECT_EMAIL=${ARCHITECT_EMAIL:-notisastranov@gmail.com}")
          echo "sync ARCHITECT_EMAIL"
          if [ ${#ARGS[@]} -gt 0 ]; then
            supabase secrets set "${ARGS[@]}"
          else
            echo "No API secrets in GH — keep existing Supabase secrets"
          fi

  cloudflare-worker:
    runs-on: ubuntu-latest
    name: Deploy origin proxy worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy astranov-origin-proxy
        working-directory: workers/astranov-origin-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — cannot fix astranov.eu 502"
            exit 0
          fi
          npm install -g wrangler@4
          wrangler deploy

  cloudflare-purge:
    runs-on: ubuntu-latest
    name: Purge Cloudflare cache
    needs: [edge-functions, cloudflare-worker]
    if: always()
    steps:
      - name: Purge cache
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN not set — skipping"
            exit 0
          fi
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=astranov.eu" \
            -H "Authorization: Bearer $CF_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('result',[{}])[0].get('id','') if d.get('result') else '')")
          if [ -z "$ZONE_ID" ]; then
            echo "Could not resolve zone id for astranov.eu"
            exit 0
          fi
          echo "Zone: $ZONE_ID"
          RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$RESP"
