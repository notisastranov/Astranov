name: CF fix domain

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/astranov-origin-proxy/**'
      - '.github/workflows/cf-fix-domain.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe CF token + fix origin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: 04faced90ecdb9aae7c15537751180da
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN missing"
            exit 1
          fi
          echo "token_len=${#CLOUDFLARE_API_TOKEN}"

          python3 <<'PY'
          import json, os, urllib.request, urllib.error, ssl

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT = os.environ["ACCOUNT_ID"]
          H = {
            "Authorization": f"Bearer {TOKEN}",
            "Content-Type": "application/json",
          }

          def api(method, url, body=None):
            data = None if body is None else json.dumps(body).encode()
            req = urllib.request.Request(url, data=data, headers=H, method=method)
            try:
              with urllib.request.urlopen(req, timeout=60) as r:
                return r.status, json.loads(r.read().decode() or "{}")
            except urllib.error.HTTPError as e:
              raw = e.read().decode(errors="replace")
              try:
                j = json.loads(raw)
              except Exception:
                j = {"raw": raw[:500]}
              return e.code, j

          st, ver = api("GET", "https://api.cloudflare.com/client/v4/user/tokens/verify")
          print("verify", st, ver.get("success"), (ver.get("result") or {}).get("status"))

          st, zones = api("GET", "https://api.cloudflare.com/client/v4/zones?name=astranov.eu")
          zone = (zones.get("result") or [{}])[0]
          zone_id = zone.get("id")
          print("zone", zone_id, zone.get("status"), "success", zones.get("success"), zones.get("errors"))
          if not zone_id:
            raise SystemExit("no zone")

          st, scripts = api("GET", f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/workers/scripts")
          print("list_scripts", st, scripts.get("success"), scripts.get("errors"))
          if scripts.get("result"):
            print("script_names", [x.get("id") for x in scripts["result"]][:30])

          st, routes = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes")
          print("routes", st, routes.get("success"), routes.get("errors"))
          for r in routes.get("result") or []:
            print(" route", r.get("id"), r.get("pattern"), "script=", r.get("script"))

          st, dns = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?per_page=100")
          print("dns", st, dns.get("success"), "count", len(dns.get("result") or []))
          for r in dns.get("result") or []:
            if r.get("name") in ("astranov.eu", "www.astranov.eu") or r.get("type") in ("A","AAAA","CNAME"):
              print(" ", r.get("type"), r.get("name"), "->", r.get("content"), "proxied=", r.get("proxied"), "id=", r.get("id"))

          # Persist for next steps
          open(os.environ["GITHUB_ENV"], "a").write(f"CF_ZONE_ID={zone_id}\n")
          open("/tmp/cf_state.json", "w").write(json.dumps({
            "zone_id": zone_id,
            "routes": routes.get("result") or [],
            "can_list_scripts": bool(scripts.get("success")),
            "dns": [
              {k: r.get(k) for k in ("id","type","name","content","proxied")}
              for r in (dns.get("result") or [])
            ],
          }))
          PY

      - name: Deploy multi-origin worker (wrangler)
        id: wrangler
        working-directory: workers/astranov-origin-proxy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler@4
          wrangler deploy 2>&1 | tee /tmp/wrangler.out
          grep -q "Deployed\|Uploaded\|Current Version" /tmp/wrangler.out && echo "ok=1" >> "$GITHUB_OUTPUT" || echo "ok=0" >> "$GITHUB_OUTPUT"

      - name: Fallback — upload worker script via API
        if: steps.wrangler.outcome != 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: 04faced90ecdb9aae7c15537751180da
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error, mimetypes
          from pathlib import Path

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          ACCOUNT = os.environ["ACCOUNT_ID"]
          script = Path("workers/astranov-origin-proxy/src/index.js").read_text()
          # Module worker metadata
          metadata = {
            "main_module": "index.js",
            "compatibility_date": "2026-07-01",
            "bindings": [
              {"type": "plain_text", "name": "ORIGIN", "text": "https://astranov.pages.dev"},
              {"type": "plain_text", "name": "VERCEL_ORIGIN", "text": "https://astranov-astranov.vercel.app"},
            ],
          }
          boundary = "----astranovBoundary7MA4YWxkTrZu0gW"
          body = []
          def part(name, filename, content, ctype):
            body.append(f"--{boundary}\r\n".encode())
            disp = f'Content-Disposition: form-data; name="{name}"'
            if filename:
              disp += f'; filename="{filename}"'
            body.append((disp + "\r\n").encode())
            body.append(f"Content-Type: {ctype}\r\n\r\n".encode())
            body.append(content if isinstance(content, bytes) else content.encode())
            body.append(b"\r\n")
          part("metadata", None, json.dumps(metadata), "application/json")
          part("index.js", "index.js", script, "application/javascript+module")
          body.append(f"--{boundary}--\r\n".encode())
          data = b"".join(body)
          url = f"https://api.cloudflare.com/client/v4/accounts/{ACCOUNT}/workers/scripts/astranov-origin-proxy"
          req = urllib.request.Request(url, data=data, method="PUT", headers={
            "Authorization": f"Bearer {TOKEN}",
            "Content-Type": f"multipart/form-data; boundary={boundary}",
          })
          try:
            with urllib.request.urlopen(req, timeout=120) as r:
              j = json.loads(r.read().decode())
              print("upload success", j.get("success"), j.get("errors"))
          except urllib.error.HTTPError as e:
            print("upload fail", e.code, e.read().decode(errors="replace")[:800])
            raise
          PY

      - name: Ensure worker routes on zone
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          zone = os.environ.get("CF_ZONE_ID")
          if not zone:
            import pathlib
            zone = json.loads(pathlib.Path("/tmp/cf_state.json").read_text())["zone_id"]
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          def api(method, url, body=None):
            data = None if body is None else json.dumps(body).encode()
            req = urllib.request.Request(url, data=data, headers=H, method=method)
            try:
              with urllib.request.urlopen(req, timeout=60) as r:
                return r.status, json.loads(r.read().decode() or "{}")
            except urllib.error.HTTPError as e:
              return e.code, json.loads(e.read().decode(errors="replace") or "{}")

          wanted = [
            ("astranov.eu/*", "astranov-origin-proxy"),
            ("www.astranov.eu/*", "astranov-origin-proxy"),
          ]
          st, routes = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone}/workers/routes")
          existing = {(r.get("pattern"), r.get("script")): r for r in (routes.get("result") or [])}
          print("existing routes", [(r.get("pattern"), r.get("script"), r.get("id")) for r in (routes.get("result") or [])])

          # If old broken worker name differs, retarget routes
          for pattern, script in wanted:
            hit = next((r for r in (routes.get("result") or []) if r.get("pattern") == pattern), None)
            if hit and hit.get("script") == script:
              print("route ok", pattern)
              continue
            if hit:
              st, j = api("PUT", f"https://api.cloudflare.com/client/v4/zones/{zone}/workers/routes/{hit['id']}", {
                "pattern": pattern, "script": script
              })
              print("update route", pattern, st, j.get("success"), j.get("errors"))
            else:
              st, j = api("POST", f"https://api.cloudflare.com/client/v4/zones/{zone}/workers/routes", {
                "pattern": pattern, "script": script
              })
              print("create route", pattern, st, j.get("success"), j.get("errors"))

          # Also: if we cannot edit worker, try remove broken routes so DNS/origin can serve
          # Only if script name is something else and we failed to retarget
          PY

      - name: Fallback DNS → Vercel if worker still broken
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Point apex/www CNAME/A to Vercel only if site still 502 AND we have DNS edit
          # Prefer keeping worker; this is last resort grey-cloud cname
          python3 <<'PY'
          import json, os, urllib.request, urllib.error, ssl, time
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          zone = os.environ.get("CF_ZONE_ID") or json.load(open("/tmp/cf_state.json"))["zone_id"]
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          def api(method, url, body=None):
            data = None if body is None else json.dumps(body).encode()
            req = urllib.request.Request(url, data=data, headers=H, method=method)
            try:
              with urllib.request.urlopen(req, timeout=60) as r:
                return r.status, json.loads(r.read().decode() or "{}")
            except urllib.error.HTTPError as e:
              return e.code, json.loads(e.read().decode(errors="replace") or "{}")

          def site_status():
            try:
              req = urllib.request.Request("https://astranov.eu/", method="GET")
              with urllib.request.urlopen(req, timeout=20) as r:
                return r.status, r.read()[:80]
            except urllib.error.HTTPError as e:
              return e.code, e.read()[:80]
            except Exception as e:
              return 0, str(e).encode()

          code, body = site_status()
          print("site_before", code, body[:80])
          if code == 200 and b"<!DOCTYPE" in body or code == 200:
            print("site already healthy — skip DNS fallback")
            raise SystemExit(0)

          # If worker routes exist, try delete them so origin DNS can work
          st, routes = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone}/workers/routes")
          for r in routes.get("result") or []:
            rid = r.get("id")
            if not rid: continue
            st, j = api("DELETE", f"https://api.cloudflare.com/client/v4/zones/{zone}/workers/routes/{rid}")
            print("delete route", r.get("pattern"), st, j.get("success"), j.get("errors"))

          # Ensure CNAME www and apex flatten toward Vercel
          # Vercel recommended: CNAME www -> cname.vercel-dns.com, apex A 76.76.21.21
          st, dns = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone}/dns_records?per_page=100")
          records = dns.get("result") or []

          def upsert(type_, name, content, proxied=True):
            hit = next((r for r in records if r.get("name") == name and r.get("type") == type_), None)
            payload = {"type": type_, "name": name, "content": content, "proxied": proxied, "ttl": 1}
            if hit:
              st, j = api("PUT", f"https://api.cloudflare.com/client/v4/zones/{zone}/dns_records/{hit['id']}", payload)
              print("update dns", type_, name, st, j.get("success"), j.get("errors"))
            else:
              # maybe same name different type — leave others
              st, j = api("POST", f"https://api.cloudflare.com/client/v4/zones/{zone}/dns_records", payload)
              print("create dns", type_, name, st, j.get("success"), j.get("errors"))

          # Prefer pointing proxied DNS to Vercel; without worker route CF should reverse-proxy to origin
          upsert("CNAME", "www.astranov.eu", "cname.vercel-dns.com", True)
          # apex: CNAME flatten to vercel
          # delete conflicting A if needed
          for r in records:
            if r.get("name") == "astranov.eu" and r.get("type") in ("A", "AAAA", "CNAME"):
              if r.get("content") not in ("cname.vercel-dns.com", "76.76.21.21"):
                st, j = api("DELETE", f"https://api.cloudflare.com/client/v4/zones/{zone}/dns_records/{r['id']}")
                print("delete old apex", r.get("type"), r.get("content"), st, j.get("success"))
          upsert("CNAME", "astranov.eu", "cname.vercel-dns.com", True)

          time.sleep(3)
          code2, body2 = site_status()
          print("site_after", code2, body2[:120])
          PY

      - name: Purge cache + final check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error, time
          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          zone = os.environ.get("CF_ZONE_ID") or json.load(open("/tmp/cf_state.json"))["zone_id"]
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
          def api(method, url, body=None):
            data = None if body is None else json.dumps(body).encode()
            req = urllib.request.Request(url, data=data, headers=H, method=method)
            try:
              with urllib.request.urlopen(req, timeout=60) as r:
                return r.status, json.loads(r.read().decode() or "{}")
            except urllib.error.HTTPError as e:
              return e.code, json.loads(e.read().decode(errors="replace") or "{}")
          st, j = api("POST", f"https://api.cloudflare.com/client/v4/zones/{zone}/purge_cache", {"purge_everything": True})
          print("purge", st, j.get("success"), j.get("errors"))
          time.sleep(2)
          for url in [
            "https://astranov.eu/",
            "https://astranov.eu/__edge_health",
            "https://www.astranov.eu/",
            "https://astranov-astranov.vercel.app/",
          ]:
            try:
              req = urllib.request.Request(url, method="GET")
              with urllib.request.urlopen(req, timeout=25) as r:
                body = r.read(120)
                print(url, r.status, body[:80])
            except urllib.error.HTTPError as e:
              print(url, e.code, e.read(80))
            except Exception as e:
              print(url, "ERR", e)
          PY
