name: CF grey-cloud to Vercel
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/cf-grey-vercel.yml']

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Point astranov.eu DNS-only to Vercel (bypass worker)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json, os, urllib.request, urllib.error, time

          TOKEN = os.environ["CLOUDFLARE_API_TOKEN"]
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}

          def api(method, url, body=None):
            data = None if body is None else json.dumps(body).encode()
            req = urllib.request.Request(url, data=data, headers=H, method=method)
            try:
              with urllib.request.urlopen(req, timeout=60) as r:
                return r.status, json.loads(r.read().decode() or "{}")
            except urllib.error.HTTPError as e:
              raw = e.read().decode(errors="replace")
              try: j = json.loads(raw)
              except: j = {"raw": raw[:500]}
              return e.code, j

          st, zones = api("GET", "https://api.cloudflare.com/client/v4/zones?name=astranov.eu")
          zone = (zones.get("result") or [{}])[0]
          zone_id = zone.get("id")
          print("zone", zone_id, zones.get("success"), zones.get("errors"))
          if not zone_id:
            raise SystemExit(1)

          st, dns = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?per_page=100")
          print("dns success", dns.get("success"), "count", len(dns.get("result") or []))
          records = dns.get("result") or []
          for r in records:
            if r.get("name") in ("astranov.eu", "www.astranov.eu") or r.get("type") in ("A","AAAA","CNAME"):
              print(" BEFORE", r.get("type"), r.get("name"), "->", r.get("content"), "proxied=", r.get("proxied"), r.get("id"))

          def delete(rid, label):
            st, j = api("DELETE", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{rid}")
            print(" delete", label, st, j.get("success"), j.get("errors"))

          # Remove ALL apex/www A/AAAA/CNAME that are not our target
          for r in list(records):
            if r.get("name") in ("astranov.eu", "www.astranov.eu") and r.get("type") in ("A","AAAA","CNAME"):
              delete(r["id"], f'{r["type"]} {r["name"]} {r["content"]}')

          # Refresh
          st, dns = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?per_page=100")
          records = dns.get("result") or []

          def upsert(type_, name, content, proxied):
            hit = next((r for r in records if r.get("name")==name and r.get("type")==type_), None)
            payload = {"type": type_, "name": name, "content": content, "proxied": proxied, "ttl": 120 if not proxied else 1}
            if hit:
              st, j = api("PUT", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{hit['id']}", payload)
              print(" update", type_, name, content, "proxied", proxied, st, j.get("success"), j.get("errors"))
            else:
              st, j = api("POST", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records", payload)
              print(" create", type_, name, content, "proxied", proxied, st, j.get("success"), j.get("errors"))
              if j.get("result"):
                records.append(j["result"])

          # DNS-only (proxied=False) → traffic never hits CF Worker
          # Vercel: apex A 76.76.21.21 and www CNAME cname.vercel-dns.com
          upsert("A", "astranov.eu", "76.76.21.21", False)
          upsert("CNAME", "www.astranov.eu", "cname.vercel-dns.com", False)
          upsert("CNAME", "investors.astranov.eu", "cname.vercel-dns.com", False)

          # Also try delete worker routes if permitted
          st, routes = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes")
          print("routes", st, routes.get("success"), routes.get("result"), routes.get("errors"))
          for r in routes.get("result") or []:
            st, j = api("DELETE", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes/{r['id']}")
            print(" del route", r.get("pattern"), st, j.get("success"), j.get("errors"))

          time.sleep(5)
          st, dns = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?per_page=100")
          for r in dns.get("result") or []:
            if r.get("name") in ("astranov.eu", "www.astranov.eu"):
              print(" AFTER", r.get("type"), r.get("name"), "->", r.get("content"), "proxied=", r.get("proxied"))

          for url in ["https://astranov.eu/", "https://www.astranov.eu/", "http://astranov.eu/"]:
            try:
              req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 AstranovHealth/1.0"})
              with urllib.request.urlopen(req, timeout=25) as resp:
                print("GET", url, resp.status, resp.read(60))
            except urllib.error.HTTPError as e:
              print("GET", url, e.code, e.read(80))
            except Exception as e:
              print("GET", url, "ERR", type(e).__name__, e)
          PY
