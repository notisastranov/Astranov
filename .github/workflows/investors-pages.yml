name: Host investors.astranov.eu on Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'investors/**'
      - '.github/workflows/investors-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: investors-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage investors site
        run: |
          mkdir -p _site
          cp -a investors/. _site/
          printf 'investors.astranov.eu\n' > _site/CNAME
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Set custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT repos/notisastranov/astranov.eu/pages \
            -f cname='investors.astranov.eu' \
            -F https_enforced=false || true
          gh api repos/notisastranov/astranov.eu/pages || true
