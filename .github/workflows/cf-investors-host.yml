name: Host SpaceNet subdomains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'investors/**'
      - 'exchange/**'
      - '.github/workflows/cf-investors-host.yml'
      - '.github/workflows/vercel-investors-domain.yml'

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy investors + exchange and point DNS at Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN2: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -e
          TOK="${VERCEL_TOKEN:-$VERCEL_TOKEN2}"
          if [ -z "$TOK" ]; then echo "no vercel token"; exit 1; fi
          npm i -g vercel@41
          deploy_site () {
            local dir="$1" name="$2" domain="$3"
            echo "=== deploy $name ($dir) → $domain ==="
            vercel deploy "$dir" --prod --yes --token "$TOK" --name "$name" --public
            vercel domains add "$domain" --token "$TOK" --scope notisastranov-8109 --yes || \
            vercel domains add "$domain" --token "$TOK" --yes || true
            vercel alias set "$domain" --token "$TOK" --scope notisastranov-8109 || true
          }
          deploy_site investors astranov-investors investors.astranov.eu
          deploy_site exchange astranov-exchange exchange.astranov.eu
          python3 <<'PY'
          import json, os, urllib.request, urllib.error
          TOKEN = os.environ.get("CLOUDFLARE_API_TOKEN") or ""
          if not TOKEN:
            print("no cloudflare token — skip DNS")
            raise SystemExit(0)
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
          def api(method, url, body=None):
            data = None if body is None else json.dumps(body).encode()
            req = urllib.request.Request(url, data=data, headers=H, method=method)
            try:
              with urllib.request.urlopen(req, timeout=60) as r:
                return r.status, json.loads(r.read().decode() or "{}")
            except urllib.error.HTTPError as e:
              raw = e.read().decode(errors="replace")
              try: j = json.loads(raw)
              except: j = {"raw": raw[:500]}
              return e.code, j
          st, zones = api("GET", "https://api.cloudflare.com/client/v4/zones?name=astranov.eu")
          zone = (zones.get("result") or [{}])[0]
          zid = zone.get("id")
          print("zone", zid, zones.get("success"), zones.get("errors"))
          if not zid:
            raise SystemExit(0)
          def upsert(name, content):
            fqdn = name + ".astranov.eu"
            st, dns = api("GET", f"https://api.cloudflare.com/client/v4/zones/{zid}/dns_records?name={fqdn}")
            recs = dns.get("result") or []
            payload = {"type": "CNAME", "name": name, "content": content, "proxied": False, "ttl": 120}
            if recs:
              st, j = api("PUT", f"https://api.cloudflare.com/client/v4/zones/{zid}/dns_records/{recs[0]['id']}", payload)
            else:
              st, j = api("POST", f"https://api.cloudflare.com/client/v4/zones/{zid}/dns_records", payload)
            print("dns", name, st, j.get("success"), j.get("errors"), (j.get("result") or {}).get("content"))
          upsert("investors", "cname.vercel-dns.com")
          upsert("exchange", "cname.vercel-dns.com")
          PY
