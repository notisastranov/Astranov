name: Host SpaceNet subdomains

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'investors/**'
      - 'exchange/**'
      - 'scripts/host-subdomains.py'
      - '.github/workflows/cf-investors-host.yml'

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vercel API deploy + Cloudflare DNS
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN2: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/host-subdomains.py
