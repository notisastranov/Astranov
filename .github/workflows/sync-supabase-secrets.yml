name: Sync tokens into Supabase secrets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-supabase-secrets.yml'
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Write every GitHub token into Supabase edge secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CODERS_BRIDGE_SECRET: ${{ secrets.CODERS_BRIDGE_SECRET }}
          ARCHITECT_EMAIL: ${{ secrets.ARCHITECT_EMAIL }}
        run: |
          set -e
          echo "sb_token=$([ -n \"$SUPABASE_ACCESS_TOKEN\" ] && echo yes || echo no)"
          ARGS=()
          add() {
            if [ -n "$2" ]; then
              ARGS+=("$1=$2")
              echo "will_set $1"
            else
              echo "skip_empty $1"
            fi
          }
          add VERCEL_TOKEN "$VERCEL_TOKEN"
          add VERCEL_ACCESS_TOKEN "$VERCEL_ACCESS_TOKEN"
          add XAI_API_KEY "$XAI_API_KEY"
          add CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          add OPENAI_API_KEY "$OPENAI_API_KEY"
          add ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
          add OPENROUTER "$OPENROUTER_API_KEY"
          add GEMINI_API_KEY "$GEMINI_API_KEY"
          add GROQ_API_KEY "$GROQ_API_KEY"
          add CODERS_BRIDGE_SECRET "$CODERS_BRIDGE_SECRET"
          add ARCHITECT_EMAIL "$ARCHITECT_EMAIL"
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "nothing to set"
            exit 1
          fi
          npx --yes supabase@2 secrets set --project-ref lkoatrkhuigdolnjsbie "${ARGS[@]}"
          echo "--- names now ---"
          npx --yes supabase@2 secrets list --project-ref lkoatrkhuigdolnjsbie
