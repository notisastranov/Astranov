name: Access boot
on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase/functions/access-boot/**'
      - '.github/workflows/access-boot.yml'
jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy access-boot and probe
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          supabase link --project-ref lkoatrkhuigdolnjsbie
          supabase functions deploy access-boot --no-verify-jwt --project-ref lkoatrkhuigdolnjsbie
          echo BOOT_JSON
          curl -sS --max-time 40 -X POST "https://lkoatrkhuigdolnjsbie.supabase.co/functions/v1/access-boot" -H "Content-Type: application/json" -d '{}'
          echo
