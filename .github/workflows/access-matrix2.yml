name: Access matrix 2
on: workflow_dispatch
jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - name: Deep Vercel + Supabase + CF DNS write probe
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 <<'PY'
          import json,os,urllib.request,urllib.error
          def get(url, token, headers=None):
            H={'Authorization':'Bearer '+token}
            if headers: H.update(headers)
            req=urllib.request.Request(url, headers=H)
            try:
              with urllib.request.urlopen(req, timeout=40) as r:
                return r.status, json.loads(r.read().decode() or '{}')
            except urllib.error.HTTPError as e:
              try: j=json.loads(e.read().decode())
              except: j={'raw':e.reason}
              return e.code, j

          vt=os.environ.get('VERCEL_TOKEN') or ''
          print('vercel_token_len', len(vt))
          if vt:
            st,u=get('https://api.vercel.com/v2/user', vt)
            user=(u.get('user') or u)
            print('user', user.get('username'), user.get('id'), 'http', st)
            st,t=get('https://api.vercel.com/v2/teams', vt)
            teams=t.get('teams') or []
            print('teams', [(x.get('slug'), x.get('id')) for x in teams], 'err', t.get('error'))
            for team in ([None]+teams):
              tid=(team or {}).get('id')
              q=f'?limit=20&teamId={tid}' if tid else '?limit=20'
              st,p=get('https://api.vercel.com/v9/projects'+q, vt)
              ps=p.get('projects') or []
              print('projects team', (team or {}).get('slug') or 'personal', [x.get('name') for x in ps], 'err', p.get('error'))
            # domain
            st,d=get('https://api.vercel.com/v5/domains/astranov.eu', vt)
            print('domain astranov.eu', st, d.get('name') or d.get('error') or list(d.keys())[:6])
            # also try with teams
            for team in teams:
              st,d=get(f"https://api.vercel.com/v5/domains/astranov.eu?teamId={team.get('id')}", vt)
              print('domain team', team.get('slug'), st, d.get('name') or d.get('error'))

          stok=os.environ.get('SUPABASE_ACCESS_TOKEN') or ''
          print('supabase_token_len', len(stok))
          if stok:
            st,pr=get('https://api.supabase.com/v1/projects', stok)
            if isinstance(pr, list):
              for p in pr:
                print('sb_project', p.get('id'), p.get('name'), p.get('status'), p.get('region'))
            else:
              print('sb_projects_err', pr)

          cf=os.environ.get('CF') or ''
          print('cf_token_len', len(cf))
          # DNS write probe: list apex only (already know write works)
          if cf:
            st,j=get('https://api.cloudflare.com/client/v4/zones/dd571aeb31649f036f3a8e49e2acd202/dns_records?name=astranov.eu', cf)
            # get() uses Bearer - CF works with Bearer for zone token
            print('cf_dns_apex_http', st, 'success', j.get('success'), 'count', len(j.get('result') or []), 'err', j.get('errors'))
            for r in j.get('result') or []:
              print(' ', r.get('type'), r.get('name'), r.get('content'), 'proxied', r.get('proxied'))
          PY
          # supabase secrets digests
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            npx --yes supabase@2 secrets list --project-ref lkoatrkhuigdolnjsbie 2>&1 | sed 's/|.*//' 
          fi
