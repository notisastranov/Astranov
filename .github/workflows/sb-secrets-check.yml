name: SB secrets check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List edge secret names
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          echo "token_set=$([ -n \"$SUPABASE_ACCESS_TOKEN\" ] && echo yes || echo no)"
          npx --yes supabase@2 secrets list --project-ref lkoatrkhuigdolnjsbie 2>&1 | sed 's/|.*//' | tr -d ' '
          # aicycle presence booleans
          ANON=$(curl -sS "https://lkoatrkhuigdolnjsbie.supabase.co/rest/v1/" -o /dev/null -w '%{http_code}' || true)
          echo "rest_probe=$ANON"
