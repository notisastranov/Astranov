<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Kallithea topographic study">
  <rect width="1600" height="900" fill="#0b1220"/>
  <text x="48" y="52" fill="#e8c36a" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing="2">ASTRANOV · TOPOGRAPHIC STUDY</text>
  <text x="48" y="92" fill="#eaf2ff" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="700">Kallithea Ecological Village</text>
  <text x="48" y="122" fill="#9ec4ee" font-family="Inter,system-ui,sans-serif" font-size="15">Rhodes, GR · 36.387557°N  28.222533°E · maps.app.goo.gl/4yiGNUgXtNNaEqkt9</text>
  <text x="48" y="148" fill="#f3d48a" font-family="Inter,system-ui,sans-serif" font-size="12">INVESTOR PREVIEW · DESIGNED LAKE + GLASS MOTOR-HOUSES · NOT BUILT</text>

  <!-- plan, 1px = 2m, HQ at 900,470 -->
  <g transform="translate(900,470)">
    <!-- olive ring -->
    <g fill="#3d6b2f" opacity="0.9">
      <circle cx="290" cy="0" r="5"/><circle cx="205" cy="208" r="5"/><circle cx="0" cy="290" r="5"/>
      <circle cx="-205" cy="208" r="5"/><circle cx="-290" cy="0" r="5"/><circle cx="-205" cy="-208" r="5"/>
      <circle cx="0" cy="-290" r="5"/><circle cx="205" cy="-208" r="5"/>
      <circle cx="250" cy="110" r="4"/><circle cx="110" cy="250" r="4"/><circle cx="-110" cy="250" r="4"/>
      <circle cx="-250" cy="110" r="4"/><circle cx="-250" cy="-110" r="4"/><circle cx="-110" cy="-250" r="4"/>
      <circle cx="110" cy="-250" r="4"/><circle cx="250" cy="-110" r="4"/>
    </g>
    <!-- north terrace olives -->
    <g fill="#5a8f3a">
      <circle cx="-160" cy="-220" r="4"/><circle cx="-115" cy="-220" r="4"/><circle cx="-70" cy="-220" r="4"/>
      <circle cx="-25" cy="-220" r="4"/><circle cx="20" cy="-220" r="4"/><circle cx="65" cy="-220" r="4"/>
      <circle cx="110" cy="-220" r="4"/><circle cx="155" cy="-220" r="4"/>
      <circle cx="-160" cy="-255" r="4"/><circle cx="-70" cy="-255" r="4"/><circle cx="20" cy="-255" r="4"/>
      <circle cx="110" cy="-255" r="4"/><circle cx="-115" cy="-290" r="4"/><circle cx="-25" cy="-290" r="4"/>
      <circle cx="65" cy="-290" r="4"/><circle cx="155" cy="-290" r="4"/>
    </g>
    <!-- lake -->
    <ellipse cx="0" cy="0" rx="270" ry="190" fill="#0a6e8a" stroke="#14c3f3" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="250" ry="172" fill="#125e78"/>
    <!-- islets -->
    <g>
      <circle cx="60" cy="-45" r="28" fill="#6b9e4a" stroke="#3d6b2f"/><text x="60" y="-48" text-anchor="middle" fill="#0b1220" font-size="10" font-family="Inter,system-ui">Olive</text>
      <circle cx="-80" cy="-25" r="21" fill="#6b9e4a" stroke="#3d6b2f"/><text x="-80" y="-27" text-anchor="middle" fill="#0b1220" font-size="10" font-family="Inter,system-ui">Reed</text>
      <circle cx="25" cy="70" r="24" fill="#6b9e4a" stroke="#3d6b2f"/><text x="25" y="68" text-anchor="middle" fill="#0b1220" font-size="10" font-family="Inter,system-ui">Stone</text>
      <circle cx="-45" cy="35" r="19" fill="#6b9e4a" stroke="#3d6b2f"/><text x="-45" y="33" text-anchor="middle" fill="#0b1220" font-size="10" font-family="Inter,system-ui">Cypress</text>
      <circle cx="100" cy="20" r="16" fill="#6b9e4a" stroke="#3d6b2f"/><text x="100" y="18" text-anchor="middle" fill="#0b1220" font-size="9" font-family="Inter,system-ui">Heron</text>
    </g>
    <!-- HQ -->
    <circle cx="0" cy="0" r="7" fill="#0b1220" stroke="#14c3f3" stroke-width="3"/>
    <!-- glass motor-house pads north terrace -->
    <g fill="none" stroke="#7ec8ff" stroke-width="2">
      <rect x="-150" y="-248" width="28" height="16" rx="2"/>
      <rect x="-70" y="-248" width="28" height="16" rx="2"/>
      <rect x="10" y="-248" width="28" height="16" rx="2"/>
      <rect x="90" y="-248" width="28" height="16" rx="2"/>
      <rect x="-110" y="-282" width="28" height="16" rx="2"/>
      <rect x="-30" y="-282" width="28" height="16" rx="2"/>
      <rect x="50" y="-282" width="28" height="16" rx="2"/>
    </g>
    <!-- north arrow -->
    <polygon points="310,-260 318,-230 310,-238 302,-230" fill="#e8c36a"/>
    <text x="310" y="-210" text-anchor="middle" fill="#e8c36a" font-size="12" font-family="Inter,system-ui">N</text>
    <!-- scale 200m = 100px -->
    <line x1="220" y1="210" x2="320" y2="210" stroke="#9ec4ee" stroke-width="3"/>
    <text x="270" y="228" text-anchor="middle" fill="#9ec4ee" font-size="12" font-family="Inter,system-ui">200 m</text>
  </g>

  <g fill="#c5d6ea" font-family="Inter,system-ui,sans-serif" font-size="14">
    <text x="48" y="210">Source geometry · SNVillage (live OS)</text>
    <text x="48" y="242" fill="#9ec4ee">Designed lake ~1.1 km E–W × 0.75 km N–S</text>
    <text x="48" y="268" fill="#9ec4ee">5 islets · olive ring + north terrace grove</text>
    <text x="48" y="294" fill="#9ec4ee">Glass motor-houses on stone pads in the grove</text>
    <text x="48" y="320" fill="#9ec4ee">Houses sit on chassis — movable, not poured villas</text>
    <text x="48" y="360" fill="#e8c36a">Lake · olives · pads = design study</text>
    <text x="48" y="386" fill="#e8c36a">GPS is the real Kallithea HQ pin</text>
    <text x="48" y="430" fill="#7aa8d8" font-size="12">East of Koskinou · toward Kallithea coast</text>
    <text x="48" y="450" fill="#7aa8d8" font-size="12">Does not exist on the ground yet</text>
  </g>
  <rect x="48" y="820" width="14" height="14" fill="#0a6e8a" stroke="#14c3f3"/>
  <text x="72" y="832" fill="#9ec4ee" font-size="13" font-family="Inter,system-ui">Designed lake</text>
  <rect x="200" y="820" width="14" height="14" fill="#6b9e4a"/>
  <text x="224" y="832" fill="#9ec4ee" font-size="13" font-family="Inter,system-ui">Islet / olives</text>
  <rect x="360" y="820" width="22" height="12" fill="none" stroke="#7ec8ff"/>
  <text x="392" y="832" fill="#9ec4ee" font-size="13" font-family="Inter,system-ui">Glass motor-house pad</text>
</svg>
