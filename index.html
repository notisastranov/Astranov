<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Astranov SpaceNet Grok</title>
<meta name="astranov-build" content="4159" />
<meta name="theme-color" content="#02040a" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="stylesheet" href="/js/vendor/leaflet.css?v=4127" data-sn-map />
<style>
html,body{margin:0;height:100%;background:#02040a;color:#d8f6ff;overflow:hidden;font-family:system-ui,sans-serif}
#g{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;touch-action:none}
#city{position:fixed;inset:0;z-index:12;display:none;background:#02040a}
#city.on{display:block}
#top,#dock{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:40}
#top{top:max(8px,env(safe-area-inset-top))}
#dock{bottom:0;padding:0 10px max(12px,env(safe-area-inset-bottom))}
#island,#panel{pointer-events:auto}
#island{display:flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(4,14,28,.78);border:1px solid rgba(80,220,255,.35);border-radius:18px;width:min(94vw,520px)}
#island b{font:800 13px system-ui;letter-spacing:.08em}
#island .a{color:#4df0ff}
#island .s{color:#7ee9ff}
#island .k{color:#4a7a94}
#ver{font:800 12px system-ui;color:#4df0ff}
#heal{width:6px;height:6px;border-radius:99px;background:#4df0ff}
#panel{width:min(520px,100%);padding:8px 6px 4px}
form#f{display:flex;align-items:center;gap:10px}
input#in{flex:1;min-width:0;height:40px;border:0;background:0;color:#e8fbff;font:500 16px system-ui;outline:none}
.hub button,#plus,#go{width:44px;height:44px;border:1px solid rgba(77,240,255,.6);border-radius:999px;background:rgba(4,12,24,.4);color:#4df0ff;font-size:22px}
#line{margin:10px 4px 0;font:500 12px ui-monospace,monospace;color:#7ee9ff}
#sn-tasks-btn{height:28px;padding:0 10px;border-radius:999px;border:1px solid rgba(126,233,255,.45);background:rgba(4,16,28,.9);color:#7ee9ff;font:800 11px system-ui}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="city"></div>
<div id="top"><div id="island" title="Tap brand to wipe cache and reboot">
  <span id="heal"></span>
  <b class="a">ASTRANOV</b><b class="s">SPACENET</b><b class="k">GROK</b>
  <span id="ver">V1</span>
  <button type="button" id="sn-tasks-btn">JOBS</button>
</div></div>
<div id="dock"><div id="panel">
  <div id="line">boot</div>
  <form id="f">
    <div class="hub"><button type="button" id="plus">➕</button></div>
    <input id="in" autocomplete="off" enterkeyhint="send" placeholder="Talk to Astranov SpaceNet Grok" />
    <div class="hub"><button type="button" id="go" aria-label="Voice">🎤</button></div>
  </form>
</div></div>
<script>
(function(){
  var BUILD="4159"; window.__SN_ALIVE=true;
  function nuclear(){
    var go=function(){ location.replace("/?v="+BUILD+"&t="+Date.now()); };
    var tasks=[];
    try{ if(window.caches) tasks.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
    try{ if(navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(e){}
    Promise.all(tasks).then(go).catch(go); setTimeout(go,1400);
  }
  var island=document.getElementById("island");
  if(island) island.addEventListener("click", function(e){ if(e.target && e.target.id==="sn-tasks-btn") return; nuclear(); });
  try{ if(navigator.serviceWorker) navigator.serviceWorker.register("/sw.js?v="+BUILD,{scope:"/"}); }catch(e){}
})();
</script>
<script src="/js/vendor/leaflet.js?v=4127"></script>
<script src="/js/spacenet/app.js?v=4159"></script>
</body>
</html>
