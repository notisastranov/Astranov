<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Astranov</title>
<meta name="astranov-build" content="20260812183300" />
<script>
// Force multi-agent orbit planet load before full shell
(function(){
  var s=document.createElement('script');
  s.defer=true;
  s.src='/astranov-orbit-boot.js?v=20260812183300';
  document.head.appendChild(s);
})();
</script>
<script>
// Restore full SpaceNet shell from last good commit (pre-truncate)
(async function(){
  try {
    var r = await fetch('https://raw.githubusercontent.com/notisastranov/astranov.eu/e0e29d90aacd9e7e275eda6841389fda23fb86dd/index.html');
    var html = await r.text();
    // inject orbit-boot into the restored markup
    html = html.replace(
      /<script defer src="\/astranov-continuity\.js\?v=[^"]*"><\/script>/,
      '<script defer src="/astranov-continuity.js?v=20260812183300"><\/script>\n<script defer src="/astranov-orbit-boot.js?v=20260812183300"><\/script>'
    );
    html = html.replace(/content="20260812151903"/, 'content="20260812183300"');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div style="color:#8cf;font:14px system-ui;padding:24px">Astranov restoring shell… hard refresh if this stays. '+ (e&&e.message) +'</div>';
    console.error(e);
  }
})();
</script>
</head>
