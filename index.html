<!DOCTYPE html>
<html lang="en" class="skin-astranov theme-dark" data-theme-mode="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Astranov SpaceNet Operating System</title>
<meta name="theme-color" content="#000105" />
<meta name="astranov-build" content="20260819220000-chrome-alive" />
<meta name="astranov-continuity" content="20260819220000-chrome-alive" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<link rel="icon" href="/icon.png" type="image/png" />
<style>
html,body{margin:0;height:100%;background:#000105;color:#e8eeff;font:500 14px/1.45 system-ui,sans-serif;overflow:hidden}
#boot{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#000105}
#boot.hide{display:none!important}
.boot-title{font:800 20px/1 system-ui;letter-spacing:0.36em;color:#14c3f3}
</style>
</head>
<body>
<div id="boot"><span class="boot-title">ASTRANOV</span></div>
<script>
(function () {
  var BUILD = '20260819220000-chrome-alive';
  var url = '/index-full.html?v=' + encodeURIComponent(BUILD) + '&t=' + Date.now();
  fetch(url, { cache: 'no-store', credentials: 'same-origin' })
    .then(function (r) { if (!r.ok) throw new Error('full ' + r.status); return r.text(); })
    .then(function (html) {
      if (!html || html.indexOf('sn-topchrome') < 0) throw new Error('bad full');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      var s = document.createElement('div');
      s.innerHTML = '<p style="padding:24px;color:#8ab">SpaceNet shell recovering…</p>';
      document.body.appendChild(s);
      ['/js/spacenet/chrome-mute.js','/js/spacenet/chrome-fix.js','/js/spacenet/chrome-radar.js','/js/spacenet/os-bootloader.js','/js/spacenet/guardian.js'].forEach(function (p) {
        var t = document.createElement('script');
        t.src = p + '?v=' + BUILD;
        t.async = false;
        document.head.appendChild(t);
      });
    });
})();
</script>
</body>
</html>
