<!DOCTYPE html>
<html lang="en" class="skin-astranov theme-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Astranov SpaceNet OS</title>
<meta name="theme-color" content="#000105" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SpaceNet" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon.png" />
<meta name="astranov-build" content="20260811223000-stable-chrome" />
<style>
html,body{margin:0;height:100%;background:#000105;color:#7ec8ff;font:600 14px/1.4 system-ui,sans-serif}
#boot-msg{position:fixed;inset:0;display:grid;place-items:center;z-index:9999}
</style>
<script src="/js/spacenet/chrome-mute.js?v=20260811223000"></script>
</head>
<body>
<div id="boot-msg">ASTRANOV · SpaceNet OS…</div>
<script>
(function () {
  var URLS = [
    '/index-full.html',
    'https://raw.githubusercontent.com/notisastranov/astranov.eu/main/index-full.html',
    'https://raw.githubusercontent.com/notisastranov/astranov.eu/f566673ec1be82d87cba409e8e41ff0a8aa447bd/index.html'
  ];
  function inject(src) {
    try {
      var s = document.createElement('script');
      s.src = src;
      (document.head || document.documentElement).appendChild(s);
    } catch (_) {}
  }
  function injectAll() {
    inject('/js/spacenet/chrome-mute.js?v=20260811223000');
    inject('/js/spacenet/chrome-fix.js?v=20260811223000');
    inject('/js/spacenet/chrome-radar.js?v=20260811223000');
    inject('/js/spacenet/chrome-helper.js?v=20260811223000');
    inject('/js/spacenet/chrome-daynight.js?v=20260811140000');
    inject('/js/spacenet/chrome-install.js?v=20260811140000');
    inject('/js/spacenet/chrome-market.js?v=20260811143000');
    inject('/js/spacenet/webrtc.js?v=20260811223000');
    inject('/js/spacenet/chrome-cli-offers.js?v=20260811144000');
  }
  function go(html) {
    try {
      document.open();
      document.write(html);
      document.close();
      setTimeout(injectAll, 600);
      setTimeout(injectAll, 2200);
    } catch (e) {
      var el = document.getElementById('boot-msg');
      if (el) el.textContent = 'Restore failed · hard refresh';
      console.error(e);
    }
  }
  function tryFetch(i) {
    if (i >= URLS.length) {
      var el = document.getElementById('boot-msg');
      if (el) el.textContent = 'Could not load index · check network';
      return;
    }
    fetch(URLS[i], { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        if (!html || html.indexOf('sn-topchrome') < 0) throw new Error('bad html');
        go(html);
      })
      .catch(function () { tryFetch(i + 1); });
  }
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
  } catch (_) {}
  tryFetch(0);
})();
</script>
</body>
</html>
