<!DOCTYPE html>
<html lang="en" class="skin-spacex theme-dark" data-theme-mode="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Astranov SpaceNet Operating System</title>
<meta name="theme-color" content="#000105" id="meta-theme-color" />
<meta name="astranov-build" content="20260824150000-avc-genesis" />
<meta name="astranov-continuity" content="20260824150000-avc-genesis" />
<!-- guest-bust 20260824150000-avc-genesis mute loadChain includes avc-ledger -->
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<meta name="description" content="Astranov SpaceNet — the OS of the SpaceX phone." />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icon.png" type="image/png" />
<style id="sn-trivial-law">
#sn-topchrome-drag, #cli-drag { height: 10px !important; min-height: 10px !important; max-height: 10px !important; padding: 0 !important; margin: 0 !important; }
#sn-topchrome-drag::after, #cli-drag::after { content: none !important; display: none !important; }
#panel { grid-template-rows: 10px 44px auto auto !important; overflow: visible !important; }
#sn-task-ribbon .sn-rib-btn { width: 36px !important; height: 36px !important; border-radius: 50% !important; overflow: hidden !important; flex: 0 0 36px !important; }
#cli-coach { display: none !important; height: 0 !important; }
</style>
<style>
:root{--bg:#000105;--text:#eaf4ff;--glow:#1c8cff;--border:rgba(50,160,255,0.62);--font-ui:Inter,system-ui,sans-serif;--font-display:Space Grotesk,system-ui,sans-serif;--font-mono:JetBrains Mono,ui-monospace,monospace;--r:24px}
html,body{margin:0;width:100%;height:100%;height:100dvh;background:var(--bg);color:var(--text);font:500 13px/1.4 var(--font-ui);overflow:hidden}
#boot{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center}
#boot.hide{display:none!important}
#globe{position:fixed;inset:0;z-index:1;width:100%;height:100%}
#sn-topchrome{position:fixed;top:0;left:0;right:0;z-index:95;display:flex;justify-content:center;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
#sn-topchrome-panel{pointer-events:auto;width:min(720px,100%);background:linear-gradient(180deg,rgba(8,22,64,0.28),rgba(0,6,22,0.36));border:1px solid var(--border);border-radius:var(--r);overflow:hidden;backdrop-filter:blur(11px)}
#sn-topchrome-drag,#cli-drag{height:10px!important;display:flex;align-items:center;justify-content:center}
#sn-topchrome-drag::before,#cli-drag::before{content:"";width:36px;height:3px;border-radius:999px;background:linear-gradient(90deg,transparent,#1c8cff,#7ec8ff,#1c8cff,transparent)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:100;display:flex;justify-content:center;padding:0 10px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
#panel{pointer-events:auto;width:min(720px,100%);background:linear-gradient(180deg,rgba(6,18,52,0.30),rgba(0,4,18,0.38));border:1px solid var(--border);border-radius:var(--r);display:grid;grid-template-rows:10px 44px auto auto;overflow:visible;backdrop-filter:blur(11px)}
.sn-cli-field{display:flex!important;align-items:center!important;gap:8px!important;width:100%!important;min-height:36px!important;padding:0 10px!important;background:rgba(0,10,32,0.42)!important;border:1px solid rgba(80,180,255,0.55)!important;border-radius:12px!important}
#cli-in,#stc-cmd-in{background:transparent!important;border:0!important;color:#f4f6f8;font:500 14px/1.3 var(--font-mono);width:100%;outline:none}
#sn-task-ribbon{display:flex;gap:6px;padding:4px 8px;height:44px;align-items:center;overflow-x:auto}
.sn-rib-btn{flex:0 0 36px;width:36px;height:36px;border-radius:50%;border:1px solid rgba(80,180,255,0.55);background:rgba(0,12,40,0.35);color:#eaf4ff;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
#stc-compact{display:grid;grid-template-columns:auto 1fr auto;align-items:center;padding:4px 10px;min-height:52px}
#field-radar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(80,180,255,0.35),#020617)}
#btn-home{font:800 15px/1.1 var(--font-display);letter-spacing:0.28em;color:#7ec8ff;background:transparent;border:0}
#field-balance-hud{padding:6px 12px;border-radius:16px;border:1px solid var(--border)}
</style>
</head>
<body>
<div id="boot" aria-label="ASTRANOV loading"><div style="text-align:center"><span style="font:800 20px/1 Space Grotesk,system-ui,sans-serif;letter-spacing:0.36em;color:#14c3f3">ASTRANOV</span></div></div>
<div id="globe" aria-label="Earth"></div>
<div id="city-map" aria-hidden="true"></div>
<div id="sn-topchrome" aria-label="Top scroll">
  <div id="sn-topchrome-panel" class="collapsed" role="region">
    <div id="stc-body"><div id="stc-compact">
      <div class="stc-col-radar"><div id="field-radar"></div></div>
      <div class="stc-col-device" style="text-align:center"><button type="button" id="btn-home">ASTRANOV</button></div>
      <div class="stc-col-money" style="display:flex;align-items:center;gap:10px;justify-content:flex-end">
        <div id="field-balance-hud"><span id="fbh-s">⭐ 0.00</span></div>
        <button type="button" id="sn-task-launch" class="mode-standby" aria-label="Task launcher"></button>
      </div>
    </div></div>
    <form id="stc-cmd" autocomplete="off"><label class="sn-cli-field"><span class="sn-cli-star">★</span>
      <input id="stc-cmd-in" type="text" autocomplete="off" spellcheck="false" placeholder="Command the HUD · show, hide, or reshape" aria-label="Command the HUD · show, hide, or reshape" /></label></form>
    <div id="sn-topchrome-drag" title="Drag to expand"></div>
  </div>
</div>
<div id="dock">
  <div id="panel" class="collapsed">
    <div id="cli-drag" title="Drag to expand CLI"></div>
    <div id="sn-task-ribbon" aria-label="Quick actions">
      <button type="button" class="sn-rib-btn" data-act="locate" id="sn-rib-locate" title="Locate">📍</button>
      <button type="button" class="sn-rib-btn" data-act="polygon" id="sn-rib-poly" title="Poly">🔶</button>
      <button type="button" class="sn-rib-btn" data-act="user" id="sn-rib-user" title="Login">👤</button>
      <button type="button" class="sn-rib-btn" data-act="call" id="sn-rib-call" title="Call">📞</button>
      <button type="button" class="sn-rib-btn" data-act="add" id="sn-rib-add" title="Add">➕</button>
      <button type="button" class="sn-rib-btn" data-act="layers" id="sn-rib-layers" title="Layers">🗺️</button>
      <button type="button" class="sn-rib-btn" data-act="handsfree" id="sn-rib-hf" title="AI">🎤</button>
      <button type="button" class="sn-rib-btn" data-act="send" id="sn-rib-send" title="Send">📤</button>
    </div>
    <div id="cli-log" aria-live="polite"></div>
    <form id="cli-form" autocomplete="off"><label class="sn-cli-field"><span class="sn-cli-star">★</span>
      <input id="cli-in" type="text" autocomplete="off" spellcheck="false" placeholder="Command the HUD · show, hide, or reshape" aria-label="Command the HUD · show, hide, or reshape" /></label></form>
  </div>
</div>
<script src="/js/spacenet/mobile-life.js?v=20260824150000-avc-genesis"></script>
<script src="/js/spacenet/phone-os.js?v=20260824150000-avc-genesis"></script>
<script src="/js/spacenet/chrome-place-earth-20260824133000.js?v=20260824150000-avc-genesis" data-sn-place-earth="1"></script>
<script src="/js/spacenet/chrome-mute-20260824150000.js?v=20260824150000-avc-genesis"></script>
<script src="/js/spacenet/chrome-fix.js?v=20260823203000-keeppulse"></script>
<script src="/js/spacenet/chrome-rib-face.js?v=20260824150000-avc-genesis"></script>
<script src="/js/spacenet/chrome-radar.js?v=20260824150000-avc-genesis"></script>
<script src="/js/spacenet/os-bootloader.js?v=20260824150000-avc-genesis"></script>
<script src="/js/spacenet/guardian.js?v=20260824150000-avc-genesis"></script>
</body>
</html>
