<!DOCTYPE html>
<html lang="en" class="skin-astranov theme-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Astranov SpaceNet</title>
<meta name="theme-color" content="#000105" />
<meta name="astranov-build" content="20260811124500-bootstrap-full" />
<style>
html,body{margin:0;height:100%;background:#000105;color:#7ec8ff;font:600 14px/1.4 system-ui,sans-serif}
#boot-msg{position:fixed;inset:0;display:grid;place-items:center;z-index:9999}
</style>
</head>
<body>
<div id="boot-msg">ASTRANOV · loading…</div>
<script>
(function () {
  var URLS = [
    '/index-full.html',
    'https://raw.githubusercontent.com/notisastranov/astranov.eu/main/index-full.html',
    'https://raw.githubusercontent.com/notisastranov/astranov.eu/f566673ec1be82d87cba409e8e41ff0a8aa447bd/index.html'
  ];
  function go(html) {
    try {
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      document.getElementById('boot-msg').textContent = 'Restore failed · hard refresh';
      console.error(e);
    }
  }
  function tryFetch(i) {
    if (i >= URLS.length) {
      document.getElementById('boot-msg').textContent = 'Could not load index · check network';
      return;
    }
    fetch(URLS[i], { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        if (!html || html.indexOf('sn-topchrome') < 0) throw new Error('bad html');
        go(html);
      })
      .catch(function () { tryFetch(i + 1); });
  }
  tryFetch(0);
})();
</script>
</body>
</html>
