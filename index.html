<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Astranov SpaceNet Grok</title>
<meta name="astranov-build" content="20260827114000-earth" />
<meta name="theme-color" content="#02040a" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<style>
html,body{margin:0;height:100%;background:#02040a;color:#d8f6ff;overflow:hidden;font-family:system-ui,sans-serif}
#g{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1}
#city{position:fixed;inset:0;z-index:0;display:none!important;background:#02040a;pointer-events:none!important;opacity:0!important;visibility:hidden!important}
#city.on{display:none!important;pointer-events:none!important}
#top,#dock{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:40}
#top{top:max(8px,env(safe-area-inset-top))}
#dock{bottom:0;padding:0 10px max(12px,env(safe-area-inset-bottom))}
#island,#panel{pointer-events:auto}
#island{display:flex;align-items:center;gap:7px;padding:8px 14px;background:rgba(4,14,28,.78);border:1px solid rgba(80,220,255,.35);border-radius:999px;max-width:94vw;box-shadow:0 0 22px rgba(40,200,255,.18)}
#island b{font:800 11px/1 system-ui;letter-spacing:.16em}
#island .a{color:#4df0ff;text-shadow:0 0 6px #4df0ff,0 0 16px #1ad0ff,0 0 28px #0aa}
#island .s{color:#7ee9ff;text-shadow:0 0 8px rgba(126,233,255,.55)}
#island .k{color:#4a7a94;letter-spacing:.12em}
#ver{font:700 10px/1 ui-monospace,monospace;color:#4df0ff;text-shadow:0 0 8px #4df0ff;letter-spacing:.06em}
#heal{width:7px;height:7px;border-radius:99px;background:#4df0ff;box-shadow:0 0 10px #4df0ff,0 0 18px #1ad0ff;flex-shrink:0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
#panel{width:min(520px,100%);padding:8px 6px 4px;background:linear-gradient(180deg,transparent,rgba(2,8,18,.92))}
#sn-live{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
#sn-live:empty{display:none}
#sn-live button{height:34px;padding:0 12px;border:1px solid rgba(126,233,255,.5);background:rgba(4,16,28,.8);color:#7ee9ff;font:700 11px system-ui;border-radius:8px}
form{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid rgba(126,233,255,.4)}
input#in{flex:1;min-width:0;height:40px;border:0;background:0;color:#e8fbff;font:500 16px system-ui;outline:none;caret-color:#4df0ff}
.hub button{width:38px;height:38px;border:1px solid rgba(77,240,255,.6);border-radius:999px;background:rgba(4,12,24,.4);color:#4df0ff}
#line{margin:10px 4px 0;font:500 12px/1.5 ui-monospace,monospace;color:#7ee9ff;max-height:8rem;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="city" aria-hidden="true"></div>
<div id="top"><div id="island" title="Tap brand to reboot">
  <span id="heal"></span>
  <b class="a">ASTRANOV</b><b class="s">SPACENET</b><b class="k">GROK</b>
  <span id="ver">earth</span>
</div></div>
<div id="dock"><div id="panel">
  <div id="sn-live"></div>
  <form id="f">
    <div class="hub"><button type="button" id="plus">+</button></div>
    <input id="in" autocomplete="off" enterkeyhint="send" placeholder="Talk to Astranov SpaceNet Grok" />
    <div class="hub"><button type="button" id="go" aria-label="Voice">🎤</button></div>
  </form>
  <div id="line"></div>
</div></div>
<script>
(function(){
  var BUILD="20260827114000-earth";
  window.__SN_ALIVE=true;
  try{ if(navigator.vibrate) navigator.vibrate=function(){return false;}; }catch(e){}
  function nuclear(){
    var line=document.getElementById("line");
    if(line) line.textContent="Reboot…";
    var go=function(){ location.replace("/?v="+encodeURIComponent(BUILD)+"&t="+Date.now()); };
    var tasks=[];
    try{ if(window.caches) tasks.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
    try{ if(navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(e){}
    try{ sessionStorage.clear(); }catch(e){}
    Promise.all(tasks).then(go).catch(go);
    setTimeout(go, 1400);
  }
  window.SNReboot=nuclear;
  var island=document.getElementById("island");
  if(island) island.addEventListener("click", nuclear);
  try{
    if(window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ if(k.indexOf(BUILD)<0) caches.delete(k); }); });
    if(navigator.serviceWorker) navigator.serviceWorker.register("/sw.js?v="+BUILD,{scope:"/"}).catch(function(){});
  }catch(e){}

  var cityEl=document.getElementById("city");
  var lineEl=document.getElementById("line");
  var inEl=document.getElementById("in");
  var form=document.getElementById("f");
  function hideCity(){
    try{
      if(!cityEl) return;
      cityEl.classList.remove("on");
      cityEl.style.setProperty("display","none","important");
      cityEl.style.pointerEvents="none";
    }catch(e){}
  }
  hideCity();
  function say(t){ if(!lineEl||t==null) return; try{ lineEl.textContent=String(t);}catch(e){} }
  function grok(text){
    say("…");
    fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,system:"Astranov SpaceNet Grok. Short spoken answers. Earth is the desktop. No pizza menus. No kitchen monologue."})})
      .then(function(r){ return r.json(); })
      .then(function(j){ say((j&&(j.text||j.answer||j.reply||j.message||j.response))||""); })
      .catch(function(){ say("AI busy."); });
  }
  function seat(lat,lng,z,msg){
    hideCity();
    try{
      if(window.SNGlobe && typeof SNGlobe.viewLatLng==="function"){
        SNGlobe.viewLatLng(lat,lng,z);
        if(msg) say(msg);
        return true;
      }
    }catch(e){}
    return false;
  }
  function run(raw){
    var t=String(raw||"").trim(); if(!t) return;
    var low=t.toLowerCase();
    if(low==="reboot"||low==="reset") return nuclear();
    if(low==="earth"||low==="land"||low==="nairobi"||low==="kenya"){
      return seat(-1.286,36.817,8,"Nairobi · Kenya land");
    }
    if(low==="globe") return seat(-1.286,36.817,3,"Earth");
    if(low==="kalithea"||low==="rhodes") return seat(36.387557,28.222533,12,"Kalithea · Rhodes");
    if(low==="streets"||low==="street"){
      var v=window.SNGlobe&&SNGlobe.viewLatLng();
      return seat((v&&v.lat)||-1.286,(v&&v.lng)||36.817,15,"Streets · globe tiles");
    }
    if(low==="satellite"||low==="sat"){
      var s=window.SNGlobe&&SNGlobe.viewLatLng();
      return seat((s&&s.lat)||-1.286,(s&&s.lng)||36.817,12,"Satellite · globe tiles");
    }
    if(low==="locate"||low==="where am i"){
      var c=window.SNGlobe&&typeof SNGlobe.viewLatLng==="function"?SNGlobe.viewLatLng():null;
      if(c) return say("Camera · "+c.lat.toFixed(4)+","+c.lng.toFixed(4)+" · no GPS");
      return say("Earth · no GPS");
    }
    if(low.indexOf("pizza")>=0||low.indexOf("pay")>=0||low==="call"||low.indexOf("order")>=0||low==="deposit"){
      return say("Earth box — land only.");
    }
    if(low==="city"||low==="map"||low==="leaflet"){
      hideCity();
      return say("Leaflet hidden · Earth stays.");
    }
    return grok(t);
  }
  window.SN={gold:true,ver:BUILD,build:BUILD,run:run,need:function(){},clear:function(){}};
  hideCity();
  setInterval(hideCity, 2000);
  if(form) form.addEventListener("submit", function(e){ e.preventDefault(); var v=inEl&&inEl.value; if(inEl) inEl.value=""; run(v); });
  var plus=document.getElementById("plus");
  if(plus) plus.addEventListener("click", function(){ inEl&&inEl.focus(); });
  var go=document.getElementById("go");
  if(go) go.addEventListener("click", function(e){
    e.preventDefault();
    if(inEl&&inEl.value.trim()){ run(inEl.value.trim()); inEl.value=""; return; }
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ say("Type"); return; }
    var rec=new SR(); rec.continuous=false; rec.interimResults=true;
    rec.onresult=function(ev){
      var i,tx="",fin=false;
      for(i=ev.resultIndex;i<ev.results.length;i++){ tx+=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin=true; }
      if(inEl) inEl.value=tx; if(fin&&tx.trim()) run(tx.trim());
    };
    try{ rec.start(); say("Listening…"); }catch(err){ say("Mic blocked"); }
  });
})();
</script>
<script src="/js/spacenet/chrome-mute.js?v=20260827114000-earth"></script>
</body>
</html>
