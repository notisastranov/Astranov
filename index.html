<!DOCTYPE html>
<html lang="en" class="skin-astranov theme-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Astranov SpaceNet OS</title>
<meta name="theme-color" content="#000105" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="SpaceNet" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon.png" />
<meta name="astranov-build" content="20260812190000-chrome-orbit-restore" />
<style>
html,body{margin:0;height:100%;background:#000105;color:#7ec8ff;font:600 14px/1.4 system-ui,sans-serif}
#boot-msg{position:fixed;inset:0;display:grid;place-items:center;z-index:9999;letter-spacing:.18em}
</style>
<script src="/js/spacenet/chrome-mute.js?v=20260812190000"></script>
</head>
<body>
<div id="boot-msg">ASTRANOV · restoring SpaceNet chrome…</div>
<script>
(function () {
  var BUILD = '20260812190000-chrome-orbit-restore';
  /* Modern chrome only. Never pull the ancient phase-deck shell. */
  var URLS = [
    '/index-full.html?v=' + BUILD,
    'https://cdn.jsdelivr.net/gh/notisastranov/astranov.eu@f566673ec1be82d87cba409e8e41ff0a8aa447bd/index.html',
    'https://raw.githubusercontent.com/notisastranov/astranov.eu/f566673ec1be82d87cba409e8e41ff0a8aa447bd/index.html'
  ];
  var CHROME = [
    'chrome-mute',
    'chrome-fix',
    'chrome-radar',
    'chrome-helper',
    'chrome-daynight',
    'chrome-install',
    'chrome-market',
    'chrome-cli-offers',
    'chrome-marina-discipline',
    'chrome-mind-bridge',
    'webrtc',
    'sn-event',
    'sn-mesh',
    'sn-connectivity',
    'agent-orbit'
  ];

  function inject(src) {
    try {
      var s = document.createElement('script');
      s.async = true;
      s.crossOrigin = 'anonymous';
      s.src = src;
      (document.head || document.documentElement).appendChild(s);
    } catch (_) {}
  }

  function injectAll() {
    CHROME.forEach(function (name) {
      inject('/js/spacenet/' + name + '.js?v=' + BUILD);
    });
  }

  function isModern(html) {
    return html &&
      html.indexOf('sn-topchrome') >= 0 &&
      html.indexOf('sn-task-ribbon') >= 0 &&
      html.indexOf('os-bootloader') >= 0 &&
      html.indexOf('globe-deck') < 0;
  }

  function go(html) {
    try {
      html = html.replace(/20260810190500-lang-core/g, BUILD);
      html = html.replace(/20260812151903/g, BUILD);
      document.open();
      document.write(html);
      document.close();
      setTimeout(injectAll, 400);
      setTimeout(injectAll, 1800);
      setTimeout(injectAll, 4500);
    } catch (e) {
      var el = document.getElementById('boot-msg');
      if (el) el.textContent = 'Restore failed · hard refresh';
      console.error(e);
    }
  }

  function tryFetch(i) {
    if (i >= URLS.length) {
      var el = document.getElementById('boot-msg');
      if (el) el.textContent = 'Could not load modern chrome · hard refresh';
      return;
    }
    fetch(URLS[i], { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        if (!isModern(html)) throw new Error('ancient shell rejected');
        go(html);
      })
      .catch(function () { tryFetch(i + 1); });
  }

  try {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister().catch(function () {}); });
      }).catch(function () {});
    }
  } catch (_) {}
  tryFetch(0);
})();
</script>
</body>
</html>
