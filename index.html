<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Astranov SpaceNet Grok</title>
<meta name="astranov-build" content="20260825050200-btns" />
<meta name="theme-color" content="#050608" />
<link rel="manifest" href="/manifest.webmanifest" />
<style>
  html,body{margin:0;height:100%;background:#050608;color:#dfe6ee;overflow:hidden;font-family:ui-sans-serif,system-ui,sans-serif}
  #g{position:fixed;inset:0}
  #city{position:fixed;inset:0;z-index:12;display:none}
  #city.on{display:block}
  #top,#dock{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:20}
  #top{top:max(10px,env(safe-area-inset-top))}
  #dock{bottom:0;padding:0 10px max(10px,env(safe-area-inset-bottom))}
  #island,#panel{pointer-events:auto}
  #island{display:flex;align-items:center;gap:8px;border:1px solid #2a3340;border-radius:999px;background:rgba(8,9,12,.86);padding:6px 12px}
  #island b{font:600 10px/1.2 ui-sans-serif,system-ui;letter-spacing:.16em}
  #island .a{color:#dfe6ee} #island .s{color:#9ec8e8;letter-spacing:.18em;font-size:11px} #island .k{color:#7a8494;letter-spacing:.14em}
  #island button,#island #bal{height:28px;padding:0 10px;border:1px solid #2a3340;border-radius:999px;background:0;color:#dfe6ee;font:600 11px ui-sans-serif,system-ui}
  #bal{display:flex;align-items:center;color:#ffe566;font-variant-numeric:tabular-nums}
  #heal{width:8px;height:8px;border-radius:99px;background:#3d4a3a;flex-shrink:0}
  #heal.bad{background:#c45c4a}
  #heal.ok{background:#8fb37a}
  #panel{width:min(440px,100%);border:1px solid #2a3340;border-radius:22px;background:rgba(14,16,20,.92);padding:10px}
  #acts{display:flex;gap:6px;margin:0 0 8px}
  #acts button,#tx button{flex:1;height:36px;border:1px solid #2a3340;border-radius:12px;background:#16181d;color:#dfe6ee;font:600 12px ui-sans-serif,system-ui}
  #list,#menu{max-height:120px;overflow:auto;margin:0 0 8px}
  #list:empty,#menu:empty{display:none;margin:0}
  #list button,#menu button{display:flex;width:100%;justify-content:space-between;gap:8px;background:0;border:0;color:#dfe6ee;padding:8px;border-radius:12px;text-align:left;font:14px/1.3 ui-sans-serif,system-ui}
  #list button.on,#menu button.on{background:#16181d}
  #list span,#menu span,#tx{color:#7a8494;font-size:12px;font-variant-numeric:tabular-nums}
  #tx{display:flex;flex-direction:column;gap:6px;margin:0 0 8px}
  form{display:flex;align-items:center;gap:8px;min-height:44px;border:1px solid #2a3340;border-radius:14px;padding:0 8px;background:rgba(8,9,12,.7)}
  input#in{flex:1;min-width:0;height:36px;border:0;background:0;color:#dfe6ee;font:15px ui-sans-serif,system-ui;outline:0}
  .hub{position:relative;flex-shrink:0;width:36px;height:36px}
  .hub > button{width:36px;height:36px;border:0;border-radius:999px;background:#dfe6ee;color:#08090c;display:flex;align-items:center;justify-content:center;font:700 18px/1 ui-sans-serif,system-ui;padding:0}
  #go.listen{background:#9ec8e8}
  .ring{position:absolute;left:18px;bottom:18px;width:0;height:0;z-index:40;pointer-events:none}
  .ring button{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:1px solid #2a3340;border-radius:999px;background:rgba(14,16,20,.96);color:#dfe6ee;font:600 10px ui-sans-serif,system-ui;pointer-events:auto;padding:0}
  #line{margin:8px 4px 0;font-size:12px;color:#9aa4b2;max-height:6.5rem;overflow:auto;white-space:pre-wrap}
  .gone{display:none!important}
  .in{animation:mat .16s ease}
  @keyframes mat{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
</style>
<script>
(function () {
  var BUILD = "20260825050200-btns";
  var KEY = "sn-heal-" + BUILD;
  var DEAD = /os-bootloader|guardian|chrome-mute|chrome-fix|chrome-rib|chrome-radar|mobile-life|phone-os|owner-softload|simple-ux|chrome-shell|chrome-phone/i;
  var JS = [
    "/js/spacenet/grid-os.js?v=" + BUILD,
    "/js/spacenet/grid-os-20260825044700.js?v=" + BUILD,
    "/js/spacenet/grid-os-20260825044300.js?v=" + BUILD
  ];
  var H = {
    build: BUILD,
    sw: 0,
    cache: 0,
    hijack: 0,
    js: "",
    ai: false,
    webgl: false,
    log: []
  };
  window.SNHeal = H;
  function note(x) { H.log.push(x); if (H.log.length > 24) H.log.shift(); }
  function dot(ok) {
    var el = document.getElementById("heal");
    if (!el) return;
    el.className = ok ? "ok" : "bad";
  }
  function line(t) {
    var el = document.getElementById("line");
    if (!el || !t) return;
    el.textContent = t;
    el.classList.remove("gone");
  }
  if (location.protocol === "http:" && location.hostname !== "localhost") {
    location.replace("https://" + location.host + location.pathname + location.search);
    return;
  }
  if (navigator.serviceWorker) {
    try {
      navigator.serviceWorker.register = function () {
        note("sw-block");
        return Promise.reject(new Error("sw-block"));
      };
    } catch (e) {}
  }
  function wipe() {
    try {
      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          H.sw = rs.length;
          rs.forEach(function (r) { r.unregister(); });
        });
      }
      if (window.caches) {
        caches.keys().then(function (ks) {
          H.cache = ks.length;
          ks.forEach(function (k) { caches.delete(k); });
        });
      }
    } catch (e) { note("wipe-fail"); }
  }
  wipe();
  window.addEventListener("pagehide", wipe);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") wipe();
  });
  setInterval(wipe, 20000);
  function kill(node) {
    if (!node || !node.tagName) return;
    var tag = node.tagName.toLowerCase();
    if (tag === "script") {
      var src = node.getAttribute("src") || node.src || "";
      if (DEAD.test(src)) {
        H.hijack += 1;
        note("kill-js");
        node.type = "text/plain";
        node.src = "";
        if (node.parentNode) node.parentNode.removeChild(node);
      }
    }
    if (node.id === "cli-in" || node.id === "stc-cmd-in" || node.id === "sn-topchrome" || node.id === "cli-coach" || node.id === "fbh-s") {
      H.hijack += 1;
      note("kill-hud");
      if (node.parentNode) node.parentNode.removeChild(node);
    }
  }
  var mo = new MutationObserver(function (recs) {
    recs.forEach(function (r) {
      r.addedNodes.forEach(kill);
    });
  });
  mo.observe(document.documentElement, { childList: true, subtree: true });
  function alive(url) {
    return fetch(url, { method: "GET", cache: "no-store", signal: AbortSignal.timeout ? AbortSignal.timeout(4000) : undefined })
      .then(function (r) { return r.ok ? url : Promise.reject(); });
  }
  function load(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement("script");
      s.src = src;
      s.onload = function () { H.js = src; res(src); };
      s.onerror = rej;
      document.body.appendChild(s);
    });
  }
  function nextJs(i) {
    if (i >= JS.length) {
      dot(false);
      line("JS");
      return Promise.reject();
    }
    return alive(JS[i]).then(load, function () { return nextJs(i + 1); });
  }
  function pingAi() {
    return fetch("/api/ai", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        H.ai = !!(j && (j.keyed || j.ok));
        if (!H.ai) note("ai-unkeyed");
      })
      .catch(function () { note("ai-down"); });
  }
  function wakeAi() {
    var el = document.getElementById("line");
    if (el && el.textContent && el.textContent !== "…" && el.textContent !== "JS" && el.textContent !== "AI") return;
    fetch("/api/ai", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: "One short sentence: Grok on Astranov SpaceNet is live.", gift: true, allow_paid: true, force_paid: true, fast: true })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var t = String((j && (j.text || j.response)) || "").trim();
        if (t) line(t);
        else if (!el || !el.textContent) line("AI");
      })
      .catch(function () { line("AI"); });
  }
  function boot() {
    var had = navigator.serviceWorker && navigator.serviceWorker.controller;
    try {
      if (had && sessionStorage.getItem(KEY) !== "1") {
        sessionStorage.setItem(KEY, "1");
        location.replace(location.pathname + "?h=" + Date.now());
        return;
      }
    } catch (e) {}
    try {
      var probe = document.createElement("canvas");
      H.webgl = !!(probe.getContext("webgl") || probe.getContext("experimental-webgl"));
    } catch (e2) { H.webgl = false; }
    function report(reason) {
      var dump = {
        build: BUILD,
        reason: reason,
        href: location.href,
        ua: navigator.userAgent,
        heal: { sw: H.sw, cache: H.cache, hijack: H.hijack, js: H.js, ai: H.ai, webgl: H.webgl, log: H.log.slice() }
      };
      try { localStorage.setItem("sn:heal-last", JSON.stringify(dump)); } catch (e4) {}
      try {
        if (sessionStorage.getItem(KEY + "-fail-" + reason) === "1") return;
        sessionStorage.setItem(KEY + "-fail-" + reason, "1");
      } catch (e5) {}
      fetch("/api/fail", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(dump) }).catch(function () {});
    }
    pingAi();
    nextJs(0).then(function () {
      dot(true);
      setTimeout(function () {
        var el = document.getElementById("line");
        if (!el || !el.textContent || el.classList.contains("gone")) { wakeAi(); report("ai-silent"); }
      }, 3500);
    }).catch(function () {
      dot(false);
      wakeAi();
      report("js");
    });
    setTimeout(function () {
      if (H.hijack) report("hijack");
      if (!H.ai) report("ai-down");
    }, 5000);
    setTimeout(function () {
      if (!H.js) {
        dot(false);
        try {
          if (sessionStorage.getItem(KEY + "-js") !== "1") {
            sessionStorage.setItem(KEY + "-js", "1");
            location.replace(location.pathname + "?h=" + Date.now());
          }
        } catch (e3) {}
      }
    }, 8000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</head>
<body>
<canvas id="g"></canvas>
<div id="city"></div>
<div id="top"><div id="island">
  <span id="heal"></span>
  <b class="a">ASTRANOV</b><b class="s">SPACENET</b><b class="k">GROK</b>
  <span id="bal">0</span>
  <button id="me" class="gone" type="button">ME</button>
  <button id="mapbtn" class="gone" type="button">MAP</button>
</div></div>
<div id="dock"><div id="panel">
  <div id="tx" class="gone"></div>
  <div id="acts" class="gone">
    <button id="order" type="button">Order</button>
    <button id="call" type="button">Call</button>
  </div>
  <div id="menu"></div>
  <div id="list"></div>
  <form id="f">
    <div class="hub" id="plusHub">
      <button type="button" id="plus" aria-label="Plus">+</button>
      <div class="ring gone" id="plusRing">
        <button type="button" data-act="post">Post</button>
        <button type="button" data-act="call">Call</button>
        <button type="button" data-act="photo">Photo</button>
        <button type="button" data-act="file">File</button>
      </div>
    </div>
    <input id="in" autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="send" />
    <div class="hub" id="goHub">
      <button type="button" id="go" aria-label="Voice">
        <svg id="goIcon" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 14a3 3 0 003-3V6a3 3 0 00-6 0v5a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.93V21h2v-3.07A7 7 0 0019 11h-2z"/></svg>
      </button>
      <div class="ring gone" id="goRing">
        <button type="button" data-act="voice">Voice</button>
        <button type="button" data-act="send">Send</button>
        <button type="button" data-act="grok">Grok</button>
      </div>
    </div>
    <input id="fileIn" type="file" class="gone" />
    <input id="photoIn" type="file" accept="image/*" capture="environment" class="gone" />
  </form>
  <div id="line" class="gone"></div>
</div></div>
</body>
</html>
