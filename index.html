<!DOCTYPE html>
<html lang="en" class="skin-spacex theme-dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Astranov SpaceNet</title>
<meta name="astranov-build" content="20260824174000-chrome-alive" />
<meta name="astranov-continuity" content="20260824174000-chrome-alive" />
<meta name="theme-color" content="#000105" />
<link rel="manifest" href="/manifest.webmanifest" />
<style>
html,body{margin:0;background:#000105;color:#eaf4ff;height:100%;overflow:hidden;touch-action:manipulation}
#globe{position:fixed;inset:0;z-index:1}
#boot{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;background:#000105}
#boot.hide{display:none!important}
#sn-topchrome,#dock{position:fixed;left:0;right:0;z-index:95;display:flex!important;justify-content:center;pointer-events:none;visibility:visible!important;opacity:1!important}
#sn-topchrome{top:0;padding:max(8px,env(safe-area-inset-top,0px)) 12px 0;z-index:95}
#dock{bottom:0;padding:0 10px max(10px,env(safe-area-inset-bottom,0px));z-index:100}
#sn-topchrome-panel,#panel{pointer-events:auto;width:min(720px,100%);border:1px solid rgba(50,160,255,0.62);border-radius:24px;background:rgba(3,10,32,0.42);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);display:block!important;visibility:visible!important;opacity:1!important}
.sn-cli-field{display:flex;align-items:center;gap:8px;padding:0 10px;min-height:36px;border:1px solid rgba(80,180,255,0.55);border-radius:12px}
#cli-in,#stc-cmd-in{background:transparent;border:0;color:#f4f6f8;width:100%;font:500 14px/1.3 monospace;outline:0;min-height:28px}
#stc-cmd,#cli-form{display:block!important;visibility:visible!important;min-height:40px;padding:4px 10px 8px;margin:0}
#sn-task-ribbon{display:flex;gap:6px;padding:4px 8px;height:44px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sn-rib-btn{width:36px;height:36px;min-width:36px;border-radius:50%;border:1px solid rgba(80,180,255,0.55);background:rgba(0,12,40,0.35);flex-shrink:0}
#sn-topchrome-drag,#cli-drag{height:10px!important;min-height:10px!important;max-height:10px!important;display:block!important}
#cli-coach{display:none!important}
#cli-log{max-height:38vh;overflow-y:auto;padding:4px 10px;font:12px/1.35 monospace;color:#9ec9e8}
#panel{min-height:88px}
@media (max-height:760px){
  #stc-cmd{display:block!important}
  #panel{min-height:96px}
}
</style>
</head>
<body>
<div id="boot"><span style="font:800 20px Space Grotesk,system-ui,sans-serif;letter-spacing:0.36em;color:#14c3f3">ASTRANOV</span></div>
<div id="globe"></div>
<div id="city-map"></div>
<div id="sn-topchrome">
  <div id="sn-topchrome-panel" class="collapsed">
    <div id="stc-body">
      <div id="stc-compact" style="display:grid;grid-template-columns:auto 1fr auto;padding:4px 10px;align-items:center">
        <div id="field-radar" style="width:44px;height:44px;border-radius:50%;background:#020617"></div>
        <button id="btn-home" type="button" style="font:800 15px Space Grotesk,system-ui,sans-serif;letter-spacing:0.28em;color:#7ec8ff;background:0;border:0">ASTRANOV</button>
        <div id="field-balance-hud"><span id="fbh-s">⭐ 0.00</span></div>
      </div>
    </div>
    <form id="stc-cmd" action="javascript:void(0)">
      <label class="sn-cli-field"><span>★</span><input id="stc-cmd-in" type="text" enterkeyhint="go" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Command the HUD · show, hide, or reshape" aria-label="Command the HUD · show, hide, or reshape" /></label>
    </form>
    <div id="sn-topchrome-drag"></div>
  </div>
</div>
<div id="dock">
  <div id="panel" class="collapsed">
    <div id="cli-drag"></div>
    <div id="sn-task-ribbon">
      <button class="sn-rib-btn" id="sn-rib-locate" type="button" title="Locate">📍</button>
      <button class="sn-rib-btn" id="sn-rib-poly" type="button" title="Polygon">🔶</button>
      <button class="sn-rib-btn" id="sn-rib-user" type="button" title="User">👤</button>
      <button class="sn-rib-btn" id="sn-rib-call" type="button" title="Call">📞</button>
      <button class="sn-rib-btn" id="sn-rib-add" type="button" title="Add">➕</button>
      <button class="sn-rib-btn" id="sn-rib-layers" type="button" title="Layers">🗺️</button>
      <button class="sn-rib-btn" id="sn-rib-hf" type="button" title="Talk to Astranov">🎤</button>
      <button class="sn-rib-btn" id="sn-rib-send" type="button" title="Send">📤</button>
    </div>
    <div id="cli-log"></div>
    <form id="cli-form" action="javascript:void(0)">
      <label class="sn-cli-field"><span>★</span><input id="cli-in" type="text" enterkeyhint="go" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Command the HUD · show, hide, or reshape" aria-label="Command the HUD · show, hide, or reshape" /></label>
    </form>
  </div>
</div>
<script src="/js/spacenet/mobile-life.js?v=20260824174000-chrome-alive"></script>
<script src="/js/spacenet/phone-os.js?v=20260824174000-chrome-alive"></script>

<script src="/js/spacenet/chrome-avc-ledger-20260824150000.js?v=20260824174000-chrome-alive"></script>
<script src="/js/spacenet/chrome-mute-20260824174000.js?v=20260824174000-chrome-alive"></script>
<script src="/js/spacenet/chrome-fix.js?v=20260824174000-chrome-alive"></script>
<script src="/js/spacenet/chrome-rib-face.js?v=20260824174000-chrome-alive"></script>
<script src="/js/spacenet/chrome-radar.js?v=20260824174000-chrome-alive"></script>
<script src="/js/spacenet/os-bootloader.js?v=20260824174000-chrome-alive"></script>
<script src="/js/spacenet/guardian.js?v=20260824174000-chrome-alive"></script>
</body>
</html>
