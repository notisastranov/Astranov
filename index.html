<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Astranov SpaceNet Grok</title>
<meta name="astranov-build" content="20260827102000-reboot" />
<meta name="theme-color" content="#050608" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<link rel="manifest" href="/manifest.webmanifest" />
<style>
html,body{margin:0;height:100%;background:#02040a;color:#d8f6ff;overflow:hidden;font-family:system-ui,sans-serif}
#g{position:fixed;inset:0}
#city{position:fixed;inset:0;z-index:12;display:none;background:#02040a;pointer-events:none}
#city.on{display:block;pointer-events:auto}
#top,#dock{position:fixed;left:0;right:0;display:flex;justify-content:center;pointer-events:none;z-index:40}
#top{top:max(8px,env(safe-area-inset-top))}
#dock{bottom:0;padding:0 10px max(12px,env(safe-area-inset-bottom))}
#island,#panel{pointer-events:auto}
#island{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(8,20,36,.72);border-bottom:1px solid rgba(80,220,255,.28);max-width:96vw}
#island b{font:700 11px/1 system-ui;letter-spacing:.18em}
#island .a{color:#e8fbff}#island .s{color:#7ee9ff}#island .k{color:#5a7a90}
#ver{font:600 9px/1 ui-monospace,monospace;color:#7ee9ff;letter-spacing:.04em;white-space:nowrap}
#heal{width:7px;height:7px;border-radius:99px;background:#7ee9ff;box-shadow:0 0 12px #7ee9ff;flex-shrink:0}
#panel{width:min(520px,100%);padding:8px 6px 4px;background:linear-gradient(180deg,transparent,rgba(2,8,18,.9))}
#sn-live{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
#sn-live:empty{display:none}
#sn-live button{height:36px;padding:0 12px;border:1px solid rgba(126,233,255,.45);background:rgba(4,16,28,.75);color:#7ee9ff;font:600 12px system-ui}
form{display:flex;align-items:center;gap:10px;min-height:48px;border-bottom:1px solid rgba(126,233,255,.4)}
input#in{flex:1;min-width:0;height:40px;border:0;background:0;color:#e8fbff;font:500 16px system-ui;outline:none;caret-color:#7ee9ff}
.hub button{width:38px;height:38px;border:1px solid rgba(126,233,255,.55);border-radius:999px;background:rgba(4,12,24,.35);color:#7ee9ff}
#line{margin:10px 4px 0;font:500 12px/1.5 ui-monospace,monospace;color:#7ee9ff;max-height:8rem;overflow:auto;white-space:pre-wrap}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="city"></div>
<div id="top"><div id="island" title="Tap brand to reboot">
  <span id="heal"></span>
  <b class="a">ASTRANOV</b><b class="s">SPACENET</b><b class="k">GROK</b>
  <span id="ver">20260827102000-reboot</span>
</div></div>
<div id="dock"><div id="panel">
  <div id="sn-live"></div>
  <form id="f">
    <div class="hub"><button type="button" id="plus">+</button></div>
    <input id="in" autocomplete="off" enterkeyhint="send" placeholder="Talk to Astranov SpaceNet Grok" />
    <div class="hub"><button type="button" id="go" aria-label="Voice">🎤</button></div>
  </form>
  <div id="line">boot…</div>
</div></div>
<script src="/js/spacenet/grid-os.js?v=20260827102000-reboot"></script>
<script>
(function(){
  var BUILD="20260827102000-reboot";
  function nuclear(reason){
    var line=document.getElementById("line");
    if(line) line.textContent="Reboot · "+(reason||"brand")+" · wipe cache…";
    var go=function(){ location.replace(location.pathname+"?h="+encodeURIComponent(BUILD)+"&t="+Date.now()); };
    var tasks=[];
    try{ if(window.caches) tasks.push(caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })); }catch(e){}
    try{ if(navigator.serviceWorker) tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(r){ return r.unregister(); })); })); }catch(e){}
    try{ sessionStorage.clear(); }catch(e){}
    try{ localStorage.setItem("sn:seen-build", BUILD); }catch(e){}
    Promise.all(tasks).then(go).catch(go);
    setTimeout(go, 1600);
  }
  window.SNReboot=nuclear;
  var island=document.getElementById("island");
  if(island) island.addEventListener("click", function(){ nuclear("brand"); });
  try{
    if(window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ if(k.indexOf("20260827102000-reboot")<0) caches.delete(k); }); });
    if(navigator.serviceWorker) navigator.serviceWorker.register("/sw.js?v="+BUILD,{scope:"/"}).catch(function(){});
  }catch(e){}
  setTimeout(function(){
    if(window.__SN_ALIVE) return;
    var line=document.getElementById("line");
    if(line) line.textContent="Kernel slow — tap ASTRANOV to wipe+reboot · "+BUILD;
  }, 2500);
})();
</script>
</body>
</html>
