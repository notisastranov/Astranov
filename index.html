<!DOCTYPE html>
<html lang="en" class="skin-astranov theme-dark" data-theme-mode="auto">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Astranov SpaceNet Operating System</title>
<meta name="theme-color" content="#000105" id="meta-theme-color" />
<meta name="astranov-build" content="20260810151000-os-fullname" />
<meta name="astranov-continuity" content="20260810151000-os-fullname" />
<meta name="description" content="Astranov SpaceNet — delivery on the globe. Power on · locate · marina · polygons · pay." />
<link rel="icon" href="/icon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #000105;
  --bg-elev: #060d1c;
  --text: #e8eeff;
  --text-soft: #b8c8e0;
  --dim: #6a8ab8;
  --glow: #3d9eff;
  --glow-hot: #7ec8ff;
  --glow-rgb: 61, 158, 255;
  --mint: #3dd68c;
  --err: #e82127;
  --panel: rgba(4, 16, 42, 0.78);
  --panel-solid: #061028;
  --border: rgba(50, 140, 255, 0.42);
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --font-ui: "Inter", system-ui, sans-serif;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 24px;
  --r-sm: 16px;
  --r-pill: 999px;
  --brightness: 1;
  --chrome-sat: 1.25;
}
html.theme-light {
  --bg: #f2f4f7;
  --bg-elev: #ffffff;
  --text: #0b0d10;
  --text-soft: #3a4250;
  --dim: #6b7280;
  --glow: #0b6bcb;
  --glow-hot: #1a8cff;
  --glow-rgb: 11, 107, 203;
  --mint: #0d9f6e;
  --err: #d61f26;
  --panel: rgba(255, 255, 255, 0.88);
  --panel-solid: #ffffff;
  --border: rgba(15, 23, 42, 0.12);
  --shadow: 0 12px 36px rgba(15, 23, 42, 0.1);
  --chrome-sat: 1.05;
  color-scheme: light;
}
html.theme-dark { color-scheme: dark; }
* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%;
  background: var(--bg);
  color: var(--text);
  font: 500 14px/1.45 var(--font-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  touch-action: manipulation;
  transition: background 0.45s ease, color 0.35s ease;
}
body { filter: brightness(var(--brightness)); }
button, [role="button"], input, select {
  cursor: pointer;
  font-family: inherit;
  border-radius: var(--r-pill);
}
#boot {
  position: fixed; inset: 0; z-index: 200;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  transition: opacity 0.35s ease, background 0.45s ease;
}
#boot.os-mode { align-items: stretch; justify-content: flex-start; }
#boot.hide {
  opacity: 0 !important;
  pointer-events: none !important;
  visibility: hidden !important;
  display: none !important;
}
.boot-card { text-align: center; }
.boot-title {
  font: 800 20px/1 var(--font-display);
  letter-spacing: 0.36em;
  color: var(--glow);
  text-shadow: 0 0 12px rgba(var(--glow-rgb), 0.75);
}
.boot-loader {
  width: 148px; height: 5px; margin: 22px auto 0;
  border-radius: var(--r-pill); overflow: hidden;
  background: rgba(var(--glow-rgb), 0.15);
}
.boot-loader-bar {
  display: block; height: 100%; width: 40%;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg, var(--glow), var(--glow-hot));
  animation: slide 1.05s ease-in-out infinite;
}
@keyframes slide {
  0% { transform: translateX(-120%); }
  100% { transform: translateX(340%); }
}
#globe { position: fixed; inset: 0; z-index: 1; }
#city-map {
  position: fixed; inset: 0; z-index: 2; display: none;
  background: radial-gradient(ellipse at 50% 40%, #061830 0%, #020814 70%);
}
html.theme-light #city-map {
  background: radial-gradient(ellipse at 50% 40%, #e8eef6 0%, #d0d8e4 70%);
}
#city-map.active { display: block; }
#sn-topchrome {
  position: fixed; top: 0; left: 0; right: 0; z-index: 95;
  display: flex; justify-content: center;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 0;
  pointer-events: none;
}
#sn-topchrome-panel {
  pointer-events: auto;
  width: min(720px, 100%);
  min-height: 64px;
  background: var(--panel);
  backdrop-filter: blur(22px) saturate(var(--chrome-sat));
  -webkit-backdrop-filter: blur(22px) saturate(var(--chrome-sat));
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow), 0 0 28px rgba(var(--glow-rgb), 0.18);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, max-height 0.25s ease;
}
#sn-topchrome-panel.collapsed {
  max-height: 96px !important;
  min-height: 88px !important;
}
#sn-topchrome-panel.mid,
#sn-topchrome-panel.expanded {
  max-height: min(72vh, 560px) !important;
}
#stc-body { display: flex; flex-direction: column; }
#stc-compact {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px 12px;
  padding: 8px 12px;
  min-height: 64px;
}
.stc-col-radar { display: flex; align-items: center; gap: 8px; min-width: 0; }
#field-radar {
  position: relative;
  width: 52px; height: 52px;
  min-width: 52px; min-height: 52px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, rgba(var(--glow-rgb), 0.25), var(--bg-elev));
  box-shadow: inset 0 0 0 2px rgba(var(--glow-rgb), 0.55), 0 0 16px rgba(var(--glow-rgb), 0.3);
  overflow: hidden;
  flex: 0 0 52px;
}
html.theme-light #field-radar {
  background: radial-gradient(circle at 40% 35%, #fff, #e8eef5);
  box-shadow: inset 0 0 0 2px rgba(var(--glow-rgb), 0.45), 0 4px 14px rgba(15, 23, 42, 0.08);
}
#field-radar-canvas {
  width: 100% !important; height: 100% !important;
  display: block; border-radius: 50%;
  pointer-events: none;
}
#field-nav-meta {
  display: flex; flex-direction: column; gap: 1px;
  font: 600 10px/1.25 var(--font-mono);
  color: var(--dim);
  min-width: 0;
}
#field-nav-meta .fnm-row {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 72px;
}
#fnm-time {
  background: none; border: 0; color: var(--glow-hot);
  font: 700 11px/1.2 var(--font-mono); padding: 0; text-align: left;
  border-radius: var(--r-sm);
}
.stc-col-device { display: flex; align-items: center; justify-content: center; min-width: 0; }
#btn-home {
  font: 800 15px/1.1 var(--font-display) !important;
  letter-spacing: 0.28em !important;
  color: var(--glow) !important;
  -webkit-text-fill-color: var(--glow) !important;
  background: transparent !important;
  border: 0 !important;
  border-radius: var(--r-pill) !important;
  padding: 8px 12px;
  text-shadow: 0 0 14px rgba(var(--glow-rgb), 0.75);
  white-space: nowrap;
}
html.theme-light #btn-home { text-shadow: none; letter-spacing: 0.22em !important; }
.stc-col-money { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
#field-balance-hud {
  display: flex; flex-direction: column; align-items: flex-end;
  min-width: 64px;
  padding: 6px 12px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: rgba(var(--glow-rgb), 0.08);
}
#fbh-s { font: 800 14px/1.15 var(--font-mono); color: var(--glow-hot); }
#fbh-fees, #fbh-mine-rate { font: 600 9px/1.2 var(--font-mono); color: var(--dim); }
#sn-task-launch {
  position: relative;
  width: 48px; height: 48px;
  min-width: 48px; min-height: 48px;
  border-radius: 50% !important;
  border: 0; padding: 0;
  background: radial-gradient(circle at 35% 30%, rgba(var(--glow-rgb), 0.35), var(--bg-elev));
  box-shadow: inset 0 0 0 2px rgba(var(--glow-rgb), 0.55), 0 0 18px rgba(var(--glow-rgb), 0.35);
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 48px;
}
#sn-task-launch .sn-launch-core {
  position: absolute; inset: 6px;
  border-radius: 50%;
  background: radial-gradient(circle at 40% 35%, var(--bg-elev), var(--bg));
  opacity: 0.9;
}
#sn-task-launch .sn-launch-power {
  position: relative; z-index: 1;
  width: 22px; height: 22px;
  color: var(--glow-hot);
  filter: drop-shadow(0 0 6px rgba(var(--glow-rgb), 0.85));
}
#sn-task-launch.mode-standby {
  box-shadow: inset 0 0 0 2px rgba(200, 220, 255, 0.65), 0 0 18px rgba(180, 200, 255, 0.3);
}
html.theme-light #sn-task-launch.mode-standby {
  box-shadow: inset 0 0 0 2px rgba(15, 23, 42, 0.2), 0 4px 14px rgba(15, 23, 42, 0.08);
}
#sn-task-launch.mode-standby .sn-launch-power { color: var(--text); }
#sn-task-launch.mode-on {
  box-shadow: inset 0 0 0 2.5px rgba(61, 214, 140, 0.95), 0 0 22px rgba(61, 214, 140, 0.45);
}
#sn-task-launch.mode-on .sn-launch-power {
  color: var(--mint);
  filter: drop-shadow(0 0 8px rgba(61, 214, 140, 0.9));
}
#sn-task-launch.mode-off {
  box-shadow: inset 0 0 0 2.5px rgba(232, 33, 39, 0.95), 0 0 22px rgba(232, 33, 39, 0.4);
}
#sn-task-launch.mode-off .sn-launch-power {
  color: var(--err);
  filter: drop-shadow(0 0 8px rgba(232, 33, 39, 0.85));
}
#sn-topchrome-drag {
  height: 32px;
  min-height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  touch-action: none;
  flex-shrink: 0;
  z-index: 5;
  position: relative;
  border-top: 1px solid rgba(61, 158, 255, 0.35);
  background: linear-gradient(180deg, rgba(12, 40, 88, 0.55), rgba(4, 14, 36, 0.85));
  border-radius: 0 0 18px 18px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
}
#sn-topchrome-drag::before {
  content: '';
  width: 56px;
  height: 6px;
  border-radius: 999px;
  background: rgba(61, 158, 255, 0.9);
  box-shadow: 0 0 14px rgba(61, 158, 255, 0.7);
}
#sn-topchrome-drag::after {
  content: 'gadgets · tap';
  font: 700 10px/1 var(--font-ui);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(180, 220, 255, 0.9);
}
#sn-topchrome-panel.expanded #sn-topchrome-drag::after,
#sn-topchrome-panel.mid #sn-topchrome-drag::after {
  content: 'pull up';
}
#sn-topchrome-drag:active {
  background: rgba(20, 60, 120, 0.45);
}
#stc-theme {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 14px 12px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
#stc-theme .th-label {
  font: 700 9px/1 var(--font-ui);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
  flex: 0 0 auto;
}
#stc-theme .th-modes {
  display: flex;
  gap: 4px;
  background: rgba(var(--glow-rgb), 0.08);
  border-radius: var(--r-pill);
  padding: 3px;
  border: 1px solid var(--border);
}
#stc-theme .th-mode {
  border: 0;
  background: transparent;
  color: var(--dim);
  font: 700 10px/1 var(--font-ui);
  letter-spacing: 0.06em;
  padding: 6px 10px;
  border-radius: var(--r-pill);
  min-height: 28px;
}
#stc-theme .th-mode.on {
  background: var(--glow);
  color: #fff;
  box-shadow: 0 0 12px rgba(var(--glow-rgb), 0.45);
}
#stc-theme .th-bright {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1 1 120px;
  min-width: 100px;
}
#stc-theme .th-bright input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  appearance: none;
  height: 6px;
  border-radius: var(--r-pill);
  background: linear-gradient(90deg, #222, var(--glow));
  outline: none;
  border: 0;
}
html.theme-light #stc-theme .th-bright input[type="range"] {
  background: linear-gradient(90deg, #c8d0dc, var(--glow));
}
#stc-theme .th-bright input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--glow);
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  cursor: pointer;
}
#stc-theme .th-accent {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}
#stc-theme .th-accent input[type="color"] {
  width: 32px; height: 32px;
  border: 0;
  padding: 0;
  border-radius: 50%;
  overflow: hidden;
  background: transparent;
  cursor: pointer;
}
#stc-theme .th-accent input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
#stc-theme .th-accent input[type="color"]::-webkit-color-swatch {
  border: 2px solid var(--border);
  border-radius: 50%;
}
#stc-detail { display: none; }
#dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
  display: flex; justify-content: center;
  padding: 0 10px calc(10px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
#panel {
  pointer-events: auto;
  width: min(720px, 100%);
  max-height: 42vh;
  background: var(--panel);
  backdrop-filter: blur(20px) saturate(var(--chrome-sat));
  -webkit-backdrop-filter: blur(20px) saturate(var(--chrome-sat));
  border: 1px solid var(--border);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: background 0.4s ease, border-color 0.4s ease;
}
#panel.collapsed { max-height: min(108px, 14vh); }
#panel.mid { max-height: min(22vh, 180px) !important; }
#panel.expanded { max-height: 33.333vh !important; }
/* Empty log: hide dead space — ribbon + input only */
#panel.collapsed #cli-log:empty { display: none; }
#panel.cli-quiet #cli-log { max-height: 0; overflow: hidden; padding: 0; margin: 0; min-height: 0; }
#cli-log .cli-ops .cli-body { color: #8fd4ff; }
#sn-task-ribbon {
  /* Single strip inside CLI — not a second panel */
  flex-shrink: 0;
}
#cli-drag {
  height: 18px;
  display: flex; align-items: center; justify-content: center;
  cursor: grab; flex: 0 0 auto;
}
#cli-drag::before {
  content: '';
  width: 40px; height: 4px;
  border-radius: var(--r-pill);
  background: rgba(var(--glow-rgb), 0.45);
}
#sn-task-ribbon {
  display: flex; gap: 6px; padding: 0 12px 4px;
  overflow-x: auto; flex: 0 0 auto;
}
#cli-log {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 6px 14px;
  min-height: 40px;
  max-height: 28vh;
  font: 500 12.5px/1.5 var(--font-mono);
  color: var(--text-soft);
  -webkit-overflow-scrolling: touch;
}
#cli-log .cli-line { margin: 2px 0; word-break: break-word; }
#cli-log .cli-line.ok .cli-body { color: var(--text); }
#cli-log .cli-line.cmd .cli-body { color: var(--glow-hot); }
#cli-log .cli-line.dim .cli-body { color: var(--dim); }
#cli-log .cli-line.err .cli-body { color: var(--err); }
#cli-form {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px 12px;
  border-top: 1px solid var(--border);
  flex: 0 0 auto;
}
.cli-prompt-prefix { color: var(--glow); font: 700 15px/1 var(--font-mono); }
#cli-in {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--text);
  font: 500 14px/1.3 var(--font-mono);
  outline: none;
  caret-color: var(--glow);
  min-width: 0;
  border-radius: var(--r-sm);
}
#cli-in::placeholder { color: var(--dim); opacity: 0.7; }
#sn-poly-root .sn-pt,
#sn-poly-root .sn-pt-cbtn,
#sn-poly-root .sn-pt-btn,
#sn-poly-root .sn-pt-wide button,
#sn-poly-root .sn-pt-conf button,
#sn-poly-root .sn-pt-chip,
#sn-poly-root .sn-pt-stop,
.sn-rib-btn,
.cli-chip { border-radius: var(--r-pill) !important; }
#sn-poly-root .sn-pt { border-radius: var(--r) !important; }
#sn-poly-root .sn-pt.size-min { border-radius: var(--r-pill) !important; }
#coach, #sn-miner-terms, #spacenet-finance-panel,
#sn-game-dock, .sn-game-dock, #sn-space-hud, #sn-earth-ops-canvas,
#edge, #bar-left, #hud, #sn-burger-btn, #sn-burger-panel, .sn-game-overlay {
  display: none !important;
  pointer-events: none !important;
  visibility: hidden !important;
}
#field-radar-zoom, #field-radar-legend, #field-radar-speed,
#field-radar-caption, .fr-label, #sn-fleet-monitor,
#sn-hub-host, #fbh-econ-graph, #fbh-econ-label {
  display: none !important;
}
/* Performance + map timeline — live on top ribbon */
/* ── Top-scroll gadgets: vertical stack, drag reorder ── */
#stc-gadgets {
  display: none;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  padding: 4px 12px 10px;
  width: 100%;
  box-sizing: border-box;
}
#sn-topchrome-panel.mid #stc-gadgets,
#sn-topchrome-panel.expanded #stc-gadgets {
  display: flex;
}
.stc-gadget {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  padding: 8px 10px 10px;
  border-radius: 18px;
  background: rgba(4, 16, 40, 0.82);
  border: 1px solid rgba(61, 158, 255, 0.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 6px 16px rgba(0,0,0,0.22);
  touch-action: pan-y;
}
.stc-gadget.dragging {
  opacity: 0.88;
  border-color: rgba(100, 200, 255, 0.85);
  box-shadow: 0 0 18px rgba(40,140,255,0.35);
}
.stc-gadget.flash {
  animation: stc-g-flash 0.9s ease;
}
@keyframes stc-g-flash {
  0%, 100% { border-color: rgba(61, 158, 255, 0.35); }
  40% { border-color: rgba(0, 230, 160, 0.9); box-shadow: 0 0 20px rgba(0,220,140,0.4); }
}
.stc-g-head {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  min-height: 22px;
}
.stc-g-head:active { cursor: grabbing; }
.stc-g-grip {
  font: 700 12px/1 var(--font-mono);
  color: var(--dim);
  letter-spacing: -0.08em;
  padding: 2px 4px;
  border-radius: 8px;
  background: rgba(0,0,0,0.2);
}
.stc-g-title {
  font: 700 9px/1 var(--font-ui);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--dim);
  flex: 1;
}
.stc-g-body { width: 100%; min-width: 0; }

/* Money gadget */
#stc-money {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
#stc-money .sm-cell {
  padding: 8px 10px;
  border-radius: 14px;
  background: rgba(0, 12, 28, 0.55);
  border: 1px solid rgba(80, 160, 255, 0.28);
  min-width: 0;
}
#stc-money .sm-cell.wide { grid-column: 1 / -1; }
#stc-money .sm-k {
  font: 700 8px/1 var(--font-ui);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 4px;
}
#stc-money .sm-v {
  font: 800 15px/1.15 var(--font-mono);
  color: #7ec8ff;
  text-shadow: 0 0 10px rgba(60,160,255,0.55);
  word-break: break-all;
}
#stc-money .sm-v.mint { color: #3dd68c; text-shadow: 0 0 10px rgba(0,220,140,0.45); }
#stc-money .sm-v.gold { color: #ffd080; text-shadow: 0 0 10px rgba(255,200,80,0.4); }
#stc-money .sm-hint {
  grid-column: 1 / -1;
  font: 500 9px/1.3 var(--font-ui);
  color: var(--text-soft);
}

/* Perf gadget full width */
#stc-perf-wrap {
  display: block !important;
  width: 100%;
  height: 72px;
  border-radius: 14px;
  background: rgba(0, 12, 28, 0.45);
  border: 1px solid rgba(61, 158, 255, 0.28);
  overflow: hidden;
}
#stc-perf-wrap canvas {
  display: block;
  width: 100%;
  height: 100%;
}
#sn-topchrome-panel.expanded #stc-perf-wrap { height: 96px; }

/* Timeline full width */

  flex-direction: column;
  gap: 6px;

}

}

}

<script>
(function () {
  try {
    var h = location.hostname || '';
    if (/astranov\.eu$/i.test(h) || /pages\.dev$/i.test(h)) {
      window.SN_ASSET_BASE = 'https://cdn.jsdelivr.net/gh/notisastranov/astranov.eu@main';
    }
  } catch (e) {}
})();
(function () {
  try {
    var g = JSON.parse(localStorage.getItem('sn:last-good-gps') || 'null');
    if (g && Math.abs(g.lat - 36.4341) < 0.02 && Math.abs(g.lng - 28.2176) < 0.02) {
      localStorage.removeItem('sn:last-good-gps');
    }
  } catch (e) {}
})();
(function () {
  var root = document.documentElement;
  function isNight() {
    var h = new Date().getHours();
    return h >= 21 || h < 7;
  }
  var mode = 'auto';
  try { mode = localStorage.getItem('sn:theme-mode-v1') || 'auto'; } catch (e) {}
  var theme = mode === 'light' ? 'light' : mode === 'dark' ? 'dark' : (isNight() ? 'dark' : 'light');
  root.classList.remove('theme-light', 'theme-dark');
  root.classList.add('theme-' + theme);
  root.setAttribute('data-theme-mode', mode);
  try {
    var accent = localStorage.getItem('sn:accent-v1');
    if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
      root.style.setProperty('--glow', accent);
      root.style.setProperty('--glow-hot', accent);
      var r = parseInt(accent.slice(1, 3), 16);
      var g = parseInt(accent.slice(3, 5), 16);
      var b = parseInt(accent.slice(5, 7), 16);
      root.style.setProperty('--glow-rgb', r + ', ' + g + ', ' + b);
    }
  } catch (e2) {}
  try {
    var br = parseFloat(localStorage.getItem('sn:brightness-v1') || '1');
    if (!isFinite(br)) br = 1;
    br = Math.max(0.55, Math.min(1.25, br));
    root.style.setProperty('--brightness', String(br));
  } catch (e3) {}
  try {
    localStorage.setItem('sn:skin-v1', 'astranov');
    root.classList.add('skin-astranov');
    root.classList.remove('skin-spacex');
  } catch (e4) {}
})();
</script>

<script>
(function () {
  'use strict';
  var KEY_MODE = 'sn:theme-mode-v1';
  var KEY_BR = 'sn:brightness-v1';
  var KEY_ACCENT = 'sn:accent-v1';
  function isNight() {
    var h = new Date().getHours();
    return h >= 21 || h < 7;
  }
  function hexToRgb(hex) {
    hex = String(hex || '').replace('#', '');
    if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
    if (hex.length !== 6) return null;
    return {
      r: parseInt(hex.slice(0, 2), 16),
      g: parseInt(hex.slice(2, 4), 16),
      b: parseInt(hex.slice(4, 6), 16),
    };
  }
  function setAccent(hex) {
    if (!hex || !/^#[0-9a-fA-F]{6}$/.test(hex)) return;
    var root = document.documentElement;
    var rgb = hexToRgb(hex);
    root.style.setProperty('--glow', hex);
    root.style.setProperty('--glow-hot', hex);
    if (rgb) root.style.setProperty('--glow-rgb', rgb.r + ', ' + rgb.g + ', ' + rgb.b);
    try { localStorage.setItem(KEY_ACCENT, hex); } catch (_) {}
    var inp = document.getElementById('th-accent');
    if (inp && inp.value !== hex) inp.value = hex;
  }
  function setBrightness(v) {
    v = Math.max(0.55, Math.min(1.25, Number(v) || 1));
    document.documentElement.style.setProperty('--brightness', String(v));
    try { localStorage.setItem(KEY_BR, String(v)); } catch (_) {}
    var inp = document.getElementById('th-brightness');
    if (inp) inp.value = String(Math.round(v * 100));
  }
  function applyTheme(theme) {
    var root = document.documentElement;
    root.classList.remove('theme-light', 'theme-dark');
    root.classList.add('theme-' + (theme === 'light' ? 'light' : 'dark'));
    var meta = document.getElementById('meta-theme-color');
    if (meta) meta.setAttribute('content', theme === 'light' ? '#f2f4f7' : '#000105');
  }
  function resolveTheme(mode) {
    if (mode === 'light') return 'light';
    if (mode === 'dark') return 'dark';
    return isNight() ? 'dark' : 'light';
  }
  function setMode(mode) {
    mode = mode === 'light' || mode === 'dark' ? mode : 'auto';
    try { localStorage.setItem(KEY_MODE, mode); } catch (_) {}
    document.documentElement.setAttribute('data-theme-mode', mode);
    applyTheme(resolveTheme(mode));
    document.querySelectorAll('#stc-theme .th-mode').forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === mode);
    });
  }
  function bootTheme() {
    var mode = 'auto';
    try { mode = localStorage.getItem(KEY_MODE) || 'auto'; } catch (_) {}
    setMode(mode);
    var br = 1;
    try { br = parseFloat(localStorage.getItem(KEY_BR) || '1'); } catch (_) {}
    setBrightness(br);
    var accent = null;
    try { accent = localStorage.getItem(KEY_ACCENT); } catch (_) {}
    if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) setAccent(accent);
    else {
      var def = document.documentElement.classList.contains('theme-light') ? '#0b6bcb' : '#3d9eff';
      var inp = document.getElementById('th-accent');
      if (inp) inp.value = def;
    }
  }
  function bind() {
    document.querySelectorAll('#stc-theme .th-mode').forEach(function (b) {
      b.addEventListener('click', function () {
        setMode(b.getAttribute('data-mode'));
      });
    });
    var br = document.getElementById('th-brightness');
    if (br) {
      br.addEventListener('input', function () {
        setBrightness(Number(br.value) / 100);
      });
    }
    var ac = document.getElementById('th-accent');
    if (ac) {
      ac.addEventListener('input', function () {
        setAccent(ac.value);
      });
    }
    setInterval(function () {
      var mode = 'auto';
      try { mode = localStorage.getItem(KEY_MODE) || 'auto'; } catch (_) {}
      if (mode === 'auto') applyTheme(resolveTheme('auto'));
    }, 5 * 60 * 1000);
  }
  window.SNTheme = {
    setMode: setMode,
    setBrightness: setBrightness,
    setAccent: setAccent,
    isNight: isNight,
    boot: bootTheme,
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      bootTheme();
      bind();
    });
  } else {
    bootTheme();
    bind();
  }
})();
</script>
