<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Astranov SpaceNet</title>
<meta name="theme-color" content="#000000" />
<meta name="astranov-build" content="20260728010000-clean-spacenet" />
<meta name="astranov-continuity" content="20260728010000-clean-spacenet" />
<meta name="astranov-ip" content="(c) Astranov SpaceNet. All rights reserved." />
<meta name="astranov-mission" content="Real virtual space as UI — objects at coordinates — zoom to open" />
<meta name="astranov-ai-handoff" content="Read SPECS.md and astranov-continuity.js before edits" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<style>
  :root {
    --bg: #000;
    --text: #b8c4d4;
    --dim: #5a6a7e;
    --accent: #1a6fd4;
    --bright: #3d9eff;
    --panel: rgba(0, 6, 16, 0.92);
    --border: rgba(26, 111, 212, 0.45);
    --ok: #3d9a6a;
    --err: #c44a5a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 system-ui, sans-serif; overflow: hidden; }
  #globe { position: fixed; inset: 0; z-index: 1; }
  #globe.city-hidden { opacity: 0; pointer-events: none; }
  #city-map { position: fixed; inset: 0; z-index: 2; display: none; background: #02060c; }
  #city-map.active { display: block; }
  #hud {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: none;
  }
  #astranov-logo {
    pointer-events: auto; border: 1px solid var(--border); background: var(--panel);
    color: var(--bright); font-weight: 700; font-size: 12px; padding: 8px 16px; border-radius: 999px;
    cursor: pointer; box-shadow: 0 0 16px rgba(26,111,212,0.35);
  }
  #tier-label, #zoom-label, #hud-line {
    font: 10px/1.2 ui-monospace, monospace; color: var(--dim); text-align: center;
  }
  #hud-line { color: var(--bright); max-width: 90vw; }
  #edge {
    position: fixed; top: 12px; right: 10px; z-index: 25; display: flex; gap: 6px;
  }
  #edge button, #bar-left button {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--bright); font-weight: 700; cursor: pointer;
    font-size: 14px;
  }
  #bar-left { position: fixed; top: 12px; left: 10px; z-index: 25; display: flex; gap: 6px; align-items: center; }
  #user-chip { font: 10px ui-monospace, monospace; color: var(--dim); max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  #dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    display: flex; justify-content: center; padding: 0 10px calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;
  }
  #dock.free { justify-content: flex-start; }
  #panel {
    pointer-events: auto; width: min(520px, 100%); max-height: 42vh;
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px 14px 12px 12px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 -4px 28px rgba(0,0,0,0.55), 0 0 20px rgba(26,111,212,0.2);
    transition: max-height 0.2s ease;
  }
  #panel.collapsed { max-height: 120px; }
  #panel.mid { max-height: 38vh; }
  #panel.expanded { max-height: min(78vh, 640px); }
  #cli-drag {
    cursor: grab; padding: 8px 12px 4px; border-bottom: 1px solid rgba(26,111,212,0.25);
    user-select: none; touch-action: none;
  }
  #cli-preview { font: 11px/1.3 ui-monospace, monospace; color: var(--bright); min-height: 16px; }
  #sn-companion {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px 2px;
    border-bottom: 1px solid rgba(26,111,212,0.2);
  }
  #sn-companion canvas { width: 40px; height: 46px; image-rendering: pixelated;
    filter: drop-shadow(0 0 6px rgba(61,158,255,0.5)); }
  #sn-companion span { font: 10px ui-monospace, monospace; color: var(--dim); }
  #cli-log {
    flex: 1; overflow-y: auto; padding: 8px 12px; min-height: 48px;
    font: 12px/1.4 ui-monospace, monospace; -webkit-overflow-scrolling: touch;
  }
  #panel.collapsed #cli-log { display: none; }
  .cli-line { margin: 0 0 4px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .cli-line.cmd { color: var(--bright); }
  .cli-line.ok { color: #6dffb0; }
  .cli-line.err { color: #ff6b7a; }
  .cli-line.dim { color: var(--dim); font-size: 11px; }
  #cli-form { display: flex; border-top: 1px solid rgba(26,111,212,0.3); }
  #cli-in {
    flex: 1; border: 0; background: rgba(2,10,28,0.6); color: #c8e4ff;
    padding: 12px 14px; font: 14px/1.4 system-ui, sans-serif; outline: none; min-height: 48px;
  }
  #cli-in::placeholder { color: rgba(120,170,220,0.45); }
  #btn-expand {
    border: 0; border-left: 1px solid var(--border); background: transparent;
    color: var(--bright); padding: 0 14px; cursor: pointer; font-weight: 700;
  }
  #btn-city-close {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 40;
    display: none; border: 1px solid var(--border); background: var(--panel);
    color: var(--bright); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600;
  }
  body.city-map-on #btn-city-close { display: block; }
  body.city-map-on #hud { opacity: 0.35; }
  #boot {
    position: fixed; inset: 0; z-index: 100; background: #000; display: flex;
    align-items: center; justify-content: center; transition: opacity 0.35s;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .boot-card { text-align: center; color: var(--dim); font: 12px ui-monospace, monospace; }
  .boot-card b { display: block; color: var(--bright); font-size: 14px; margin-bottom: 8px; letter-spacing: 0.08em; }
  #coach {
    position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.72);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  #coach[hidden] { display: none !important; }
  #coach .card {
    max-width: 340px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; color: var(--text);
  }
  #coach button {
    margin-top: 12px; width: 100%; padding: 10px; border-radius: 10px;
    border: 1px solid var(--border); background: rgba(26,111,212,0.35);
    color: #fff; font-weight: 700; cursor: pointer;
  }
  .sn-pin-inner {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid #3d9eff;
    background: #061428; overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .sn-pin-inner img { width: 100%; height: 100%; object-fit: cover; }
  #perf-badge { font: 9px ui-monospace, monospace; color: var(--dim); }
</style>
</head>
<body>
<div id="boot"><div class="boot-card"><b>ASTRANOV SPACENET</b><p>Loading…</p></div></div>

<div id="globe" aria-label="Earth"></div>
<div id="city-map" aria-hidden="true"></div>

<div id="hud">
  <button type="button" id="astranov-logo" title="Hard reset">Astranov SpaceNet</button>
  <div id="tier-label">GLOBAL</div>
  <div id="zoom-label">Astranov SpaceNet</div>
  <div id="hud-line"></div>
  <div id="perf-badge">AS</div>
</div>

<div id="bar-left">
  <button type="button" id="btn-login" title="Sign in">G</button>
  <span id="user-chip"></span>
</div>
<div id="edge">
  <button type="button" id="btn-locate" title="Locate">LOC</button>
  <button type="button" id="btn-city" title="City map">MAP</button>
  <button type="button" id="btn-tile" title="Your tile">ME</button>
  <button type="button" id="sn-plus" title="Add">+</button>
</div>
<button type="button" id="btn-city-close">Globe</button>

<div id="dock">
  <div id="panel" class="mid">
    <div id="cli-drag">
      <div id="cli-preview">Type help · locate · city · shops</div>
    </div>
    <div id="sn-companion" aria-label="Companion">
      <canvas id="sn-face" width="80" height="92"></canvas>
      <span id="sn-face-line">◎ NET</span>
    </div>
    <div id="cli-log"></div>
    <form id="cli-form">
      <input id="cli-in" autocomplete="off" spellcheck="false" placeholder="locate · city · shops · go to mars · help" aria-label="SpaceNet CLI" />
      <button type="button" id="btn-expand" title="Expand">⋮</button>
    </form>
  </div>
</div>

<div id="coach" hidden>
  <div class="card">
    <b style="color:#3d9eff">Astranov SpaceNet</b>
    <p style="font-size:12px;color:#8a9bb0;margin:8px 0 0">Real space is the UI. Drag Earth · LOC to find you · MAP for city shops · type help.</p>
    <button type="button" id="coach-ok">Enter</button>
  </div>
</div>

<script>
/* Minimal companion face — deep blue dots, low FPS */
(function(){
  var c=document.getElementById('sn-face'); if(!c) return;
  var ctx=c.getContext('2d');
  var FACE=['............','..11111111..','.1111111111.','.1131111311.','.1131111311.','.1111111111.','.1111221111.','.1111111111.','.111....111.','.1111111111.','..11111111..','...111111...','....1111....','............'];
  var t0=performance.now();
  function draw(){
    if(document.hidden){ setTimeout(draw,800); return; }
    var now=performance.now()-t0, blink=Math.floor(now/3000)%8===0, cell=6;
    ctx.clearRect(0,0,c.width,c.height);
    for(var y=0;y<FACE.length;y++){
      var row=FACE[y];
      for(var x=0;x<12;x++){
        var ch=row[x]; if(ch==='.') continue;
        if(ch==='3'&&blink) continue;
        var g=ch==='2'?0.95:ch==='3'?1:0.65;
        ctx.fillStyle='rgba(26,111,212,'+(0.4+g*0.55)+')';
        ctx.shadowColor='rgba(61,158,255,0.55)'; ctx.shadowBlur=4;
        ctx.beginPath(); ctx.arc(x*cell+4,y*cell+4,2.2,0,Math.PI*2); ctx.fill();
      }
    }
    ctx.shadowBlur=0;
    setTimeout(draw,160);
  }
  draw();
})();
</script>
<script src="/js/spacenet/boot.js?v=20260728010000-clean-spacenet"></script>
<script>
document.getElementById('astranov-logo')?.addEventListener('click',function(){
  try{ localStorage.removeItem('sn:coach-v1'); }catch(e){}
  location.href=location.pathname+'?r='+Date.now();
});
document.getElementById('btn-locate')?.addEventListener('click',function(){
  window.SNCli?.run?.('locate');
});
</script>
</body>
</html>
