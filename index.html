  function afterHere(){ return ensureMap(here.lat,here.lng,"dark",15).then(function(){ if(job&&job.kind) return continueJob(); return Promise.all([huntAround("food",here), huntDrivers(here)]).then(function(pair){ vendors=pair[0]||[]; drivers=pair[1]||[]; if(!drivers.length) drivers=[{name:"Driver", lat:here.lat+0.004, lng:here.lng-0.005}]; seedFleet(drivers); paintField(); talk((vendors.length||0)+" shops · "+(drivers.length||0)+" drivers. Say what you need."); }); }); }

  function continueJob(){ if(!job||!here) return Promise.resolve(); say("Finding…"); return ensureMap(here.lat,here.lng,"dark",15).then(function(){ return Promise.all([huntAround(job.kind==="ride"?"ride":job.kind, here), huntDrivers(here)]).then(function(pair){ vendors=pair[0]||[]; drivers=pair[1]||[]; if(!drivers.length) drivers=[{name:"Driver", lat:here.lat+0.003, lng:here.lng-0.004}]; seedFleet(drivers); if(here&&vendors.length) vendors.sort(function(a,b){ return km(here,a)-km(here,b); }); paintField(); if(!vendors.length){ talk("Nothing nearby. Say another place."); return; } if(vendors.length===1){ selectVendor(vendors[0]); return; } talk(vendors.length+" found. Tap the one you want."); }); }); }
  function selectVendor(v){ selected=v; if(job){ job.shop=v; job.status="picked"; } clearNeed(); need({id:"order",label:"ORDER", run:function(){ placeOrder(v); }}); talk((v.name||"Shop")+(here?" · "+km(here,v).toFixed(1)+" km":"")+". Order when ready."); }
  function placeOrder(v){ v=v||selected||(job&&job.shop); if(!v||!here){ talk("Allow location first."); return; } if(!fleet.length) seedFleet(drivers); var g=goodsOf((job&&job.query)||"food"); var ord={id:"o"+Date.now(),shop:v,drop:here,goods:g,eta:null,driver:null}; var plan=assignOrder(ord); if(!plan.ok){ talk(plan.why||"Cannot keep this product alive on a shared route. Need another driver."); return; } (function(){ var seq=plan.sim.seq||[], t=travelMin(plan.driver,v)+4, i; for(i=0;i<seq.length;i++){ t += travelMin(i?seq[i-1].drop:v, seq[i].drop)+seq[i].goods.drop; seq[i].eta=t; } })(); orders.push(ord); if(job){ job.status="routed"; job.km=km(here,v).toFixed(1); job.min=ord.eta; job.goods=g.label; job.driver=plan.driver.name; } paintPlan(plan); clearNeed(); need({id:"pay",label:"PAY",run:function(){ payDeposit(10); }}); speakPlan(plan,ord); }
  function payDeposit(eur){ say("PayPal…"); fetch("/api/paypal/create-order",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({amount:eur||10,origin:location.origin})}).then(function(r){ return r.json().then(function(j){ return {j:j}; }); }).then(function(x){ if(x.j&&x.j.approve){ if(job) job.status="paying"; location.href=x.j.approve; return; } need({id:"pay",label:"PAY",run:function(){ payDeposit(eur||10); }}); talk("Pay is not on this host yet. Route stays ready."); }).catch(function(){ talk("Pay error."); need({id:"pay",label:"PAY",run:function(){ payDeposit(eur||10); }}); }); }
  function locate(){ if(!navigator.geolocation){ talk("No GPS on this device."); return Promise.resolve(); } say("Location…"); return new Promise(function(resolve){ navigator.geolocation.getCurrentPosition(function(p){ here={lat:p.coords.latitude,lng:p.coords.longitude}; afterHere().then(resolve).catch(resolve); }, function(){ talk("Allow location so I can find shops and drivers."); resolve(); }, {enableHighAccuracy:true,timeout:18000}); }); }
  function askMic(){ if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) return Promise.resolve(false); return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){ try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){} return true; }).catch(function(){ return false; }); }
  function listen(){ if(listening||speaking) return; var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return; listening=true; rec=new SR(); rec.continuous=false; rec.interimResults=true; rec.lang=(navigator.language||"en-US"); rec.onresult=function(ev){ var i,tx="",fin=false; for(i=ev.resultIndex;i<ev.results.length;i++){ tx+=ev.results[i][0].transcript; if(ev.results[i].isFinal) fin=true; } if(inEl) inEl.value=tx; if(fin&&tx.trim()){ listening=false; try{ rec.stop(); }catch(e){} run(tx.trim()); } }; rec.onend=function(){ listening=false; if(wantEar&&!speaking) setTimeout(listen, 500); }; rec.onerror=function(ev){ listening=false; if(ev&&ev.error==="not-allowed") wantEar=false; }; try{ rec.start(); }catch(e){ listening=false; } }
  function grok(text){ say("…"); fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text,system:"Astranov SpaceNet Grok. Short spoken answers. Help finish the user task."})}).then(function(r){ return r.json(); }).then(function(j){ talk((j&&(j.text||j.answer||j.reply||j.message||j.response))||""); }).catch(function(){ talk("AI busy."); }); }
  function intentOf(low){ if(/taxi|ride|uber|αυτοκίν|ταξί/.test(low) && !/driver/.test(low)) return "ride"; if(/pharm|φαρμακ/.test(low)) return "pharmacy"; if(/ice\s*cream|παγωτ|gelato/.test(low)) return "food"; if(/coffee|cafe|καφέ/.test(low)) return "coffee"; if(/pizza|food|delivery|order|φαγητ|πιτσ|soup|salad/.test(low)) return "food"; if(/^(go to|take me|navigate|οδήγ)/.test(low)) return "go"; return null; }
  function run(raw){ var t=String(raw||"").trim(); if(!t) return; var low=t.toLowerCase(); if(low==="reboot"||low==="reset") return nuclear(); if(low==="locate"||low==="where am i") return locate(); if(low==="status"||low==="task"||low==="tasks"||low==="route"||low==="drivers"){ if(!orders.length && !job) return talk("No open task."); var lines=fleet.filter(function(d){return d.loads.length;}).map(function(d){ return d.name+" · "+d.loads.length+" stops · "+d.loads.map(function(x){return x.goods.name+(x.eta?" "+x.eta+"m":"");}).join(", "); }); return talk(lines.length?lines.join(". "):((job&&job.kind)||"task")+" · "+((job&&job.status)||"open")); } if(low==="globe"||low==="earth"||low==="close"){ mapOn=false; try{ if(cityEl){ cityEl.classList.remove("on"); cityEl.style.pointerEvents="none"; }}catch(e){} clearNeed(); return; } if(/^map\s*(dark|bright|national|marble)?$/.test(low)){ var mk=(low.match(/dark|bright|national|marble/)||["dark"])[0]; return ensureMap((here&&here.lat)||36.44,(here&&here.lng)||28.22,mk,mk==="marble"?3:14); } if(low==="order"&&selected) return placeOrder(selected); if(low.indexOf("pay")>=0||low.indexOf("deposit")>=0) return payDeposit(10); var kind=intentOf(low); if(kind) return startJob(kind,t); return grok(t); }
  window.SN={ver:"V1",run:run,locate:locate,need:need,listen:listen};
  function boot(){ if(permsTried) return; permsTried=true; askMic().then(function(ok){ locate().then(function(){ if(!here) talk("Allow location and microphone."); else if(!ok) talk("Allow the microphone so I can hear you."); setTimeout(listen, 600); }); }); }
  if(canvas){ canvas.addEventListener("pointerdown", function(e){ if(mapOn) return; dragging=true; lx=e.clientX; ly=e.clientY; }); window.addEventListener("pointermove", function(e){ if(!dragging||mapOn) return; yaw+=(e.clientX-lx)*0.005; pitch=Math.max(-1.2,Math.min(1.2,pitch+(e.clientY-ly)*0.003)); lx=e.clientX; ly=e.clientY; }); window.addEventListener("pointerup", function(){ dragging=false; }); }
  if(form) form.addEventListener("submit", function(e){ e.preventDefault(); var v=inEl&&inEl.value; if(inEl) inEl.value=""; run(v); });
  var plus=document.getElementById("plus"); if(plus) plus.addEventListener("click", function(){ inEl&&inEl.focus(); });
  var go=document.getElementById("go"); if(go) go.addEventListener("click", function(e){ e.preventDefault(); if(inEl&&inEl.value.trim()){ run(inEl.value.trim()); inEl.value=""; return; } wantEar=true; listen(); });
  document.addEventListener("pointerdown", function(){ if(!permsTried) boot(); else if(wantEar&&!listening&&!speaking) listen(); }, {passive:true});
  window.addEventListener("resize", size); size(); tick(); setTimeout(boot, 200);
})();
