# Astranov self-hosted OSRM (optimized graphs from ./prepare.sh)
# Default graph: astranov-rhodes (fast). Greece: GRAPH_STEM=astranov-greece
#
#   ./prepare.sh && docker compose up -d
#   REGION=greece ./prepare.sh && GRAPH_STEM=astranov-greece docker compose up -d

services:
  osrm:
    image: ${OSRM_IMG:-ghcr.io/project-osrm/osrm-backend:v5.27.1}
    container_name: astranov-osrm
    restart: unless-stopped
    ports:
      - "${OSRM_PORT:-5000}:5000"
    volumes:
      - ./data:/data:ro
    environment:
      - OMP_NUM_THREADS=${THREADS:-2}
    # MLD graph from prepare.sh; max-table-size for multi-stop matrices later
    command:
      - osrm-routed
      - --algorithm
      - mld
      - --max-table-size
      - "1000"
      - --max-matching-size
      - "100"
      - --max-viaroute-size
      - "100"
      - /data/${GRAPH_STEM:-astranov-rhodes}.osrm
    healthcheck:
      # Rhodes Archangelos sector sample (works on rhodes|aegean|greece graphs)
      test:
        [
          "CMD-SHELL",
          "curl -sf 'http://127.0.0.1:5000/route/v1/driving/28.2176,36.4341;28.22,36.44?overview=false' | grep -q '\"code\":\"Ok\"' || exit 1",
        ]
      interval: 30s
      timeout: 12s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${OSRM_MEM_LIMIT:-2g}
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
